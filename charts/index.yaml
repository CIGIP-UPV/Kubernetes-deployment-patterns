  dynamic-loader:
  - annotations:
      catalog.cattle.io/timeout: 30m
    apiVersion: v2
    appVersion: humble
    created: "2026-06-05T12:15:29.114132623Z"
    description: 'Dynamic Module Loading pattern for ROS 2 robotics on Kubernetes.  Realizes
      the ROS 2 dynamic composition theory:   - A long-lived component_container_isolated
      process exposes     LoadNode / UnloadNode services.   - Plugins (camera, yolo,
      llava, voxtral) are registered via     `rclpy_components` entry_points and loaded
      INTO the container''s     process on demand — true intra-process composition,
      not subprocess     spawning.   - A FastAPI orchestrator container (sibling in
      the same pod) calls     those services via HTTP API, exposing /load, /unload,
      /list to     the dashboard.  This realisation uses true intra-process composition
      through rclpy_components and the standard ROS 2 LoadNode / UnloadNode service
      contract, instead of spawning a subprocess per loaded module. '
    digest: 77b288bc5a934fd973b3ec82f86a5b835a620c55b69ca7a06bf1d4c1881ace8c
    keywords:
    - ros2
    - dynamic-composition
    - rclpy-components
    maintainers:
