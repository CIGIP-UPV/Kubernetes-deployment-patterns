  ros2-dynamic-canonical:
  - annotations:
      catalog.cattle.io/timeout: 30m
    apiVersion: v2
    appVersion: humble
    created: "2026-05-06T20:26:53.344021238Z"
    description: 'Canonical Dynamic Module Loading pattern for ROS 2 robotics on Kubernetes.  Realizes
      the canonical ROS 2 dynamic composition theory:   - A long-lived component_container_isolated
      process exposes     LoadNode / UnloadNode services.   - Plugins (camera, yolo,
      llava, voxtral) are registered via     `rclpy_components` entry_points and loaded
      INTO the container''s     process on demand — true intra-process composition,
      not subprocess     spawning.   - A FastAPI orchestrator container (sibling in
      the same pod) calls     those services via HTTP API, exposing /load, /unload,
      /list to     the dashboard.  This canonical realisation uses true intra-process
      composition through rclpy_components and the standard ROS 2 LoadNode / UnloadNode
      service contract, instead of spawning a subprocess per loaded module. '
    digest: 20e811fec8b558f88a740345e3bdb4a5d815cbb0f841a096ff1eee90fb418ddf
    keywords:
    - ros2
    - dynamic-composition
    - rclpy-components
    - canonical
