  ros2-overlay:
  - annotations:
      catalog.cattle.io/timeout: 45m
    apiVersion: v2
    appVersion: humble
    created: "2026-07-10T12:01:41.653154771Z"
    description: 'Overlay Workspaces pattern for ROS 2 robotics on Kubernetes.  Realizes
      the OTA cloud-edge delivery model from the paper:   - ros2-base (immutable platform:
      ROS 2 + camera driver + CUDA)   - ros2-overlay-pack (mutable AI layer: ML stack
      + nodes + models)     delivered as an OCI carrier image, extracted by a Helm
      pre-install Job     to a PVC on the cloud node, and synced via HTTP from an
      nginx sidecar     to the edge node''s runtime pod via initContainer.  This realisation
      strictly separates immutable base from mutable overlay so that AI updates only
      re-publish the overlay-pack carrier (~25 GB), keeping the ROS 2 base image (~2.2
      GB) intact across releases. '
    digest: 5dc321837f99be6acbb7587229e32c2a34bf2d9ba325e33cac5bb89862e29c01
    keywords:
    - ros2
    - overlay
    - cloud-edge
    - ota
    maintainers:
    - email: mmateo@cigip.upv.es
      name: Miguel-Angel-Mateo-Casali
    name: ros2-overlay
    type: application
    urls:
    - https://cigip-upv.github.io/Kubernetes-deployment-patterns/charts/ros2-overlay-1.0.0.tgz
    version: 1.0.0
