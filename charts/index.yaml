  ros2-overlay-canonical:
  - annotations:
      catalog.cattle.io/timeout: 45m
    apiVersion: v2
    appVersion: humble
    created: "2026-05-27T11:07:39.305438576Z"
    description: 'Canonical Overlay Workspaces pattern for ROS 2 robotics on Kubernetes.  Realizes
      the OTA cloud-edge delivery model from the paper:   - ros2-base (immutable platform:
      ROS 2 + camera driver + CUDA)   - ros2-overlay-pack (mutable AI layer: ML stack
      + nodes + models)     delivered as an OCI carrier image, extracted by a Helm
      pre-install Job     to a PVC on the cloud node, and synced via HTTP from an
      nginx sidecar     to the edge node''s runtime pod via initContainer.  This canonical
      realisation strictly separates immutable base from mutable overlay so that AI
      updates only re-publish the overlay-pack carrier (~25 GB), keeping the ROS 2
      base image (~2.2 GB) intact across releases. '
    digest: 8922a49e1477f23a3fdb8665e971eccbb010ce846602928c6900279cec24799d
    keywords:
    - ros2
    - overlay
    - cloud-edge
