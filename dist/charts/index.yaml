  ros2-dynamic-canonical:
  - annotations:
      catalog.cattle.io/timeout: 30m
    apiVersion: v2
    appVersion: humble
    created: "2026-05-05T13:25:01.912396+02:00"
    description: 'Canonical Dynamic Module Loading pattern for ROS 2 robotics on Kubernetes.  Realizes
      the canonical ROS 2 dynamic composition theory:   - A long-lived component_container_isolated
      process exposes     LoadNode / UnloadNode services.   - Plugins (camera, yolo,
      llava, voxtral) are registered via     `rclpy_components` entry_points and loaded
      INTO the container''s     process on demand — true intra-process composition,
      not subprocess     spawning.   - A FastAPI orchestrator container (sibling in
      the same pod) calls     those services via HTTP API, exposing /load, /unload,
      /list to     the dashboard.  Replaces Patterns/dynamic-loader/ which used FastAPI
      + subprocess.Popen to spawn separate `ros2 run` processes — same hot-swap UX
      but missing the canonical composition semantics described in the paper. '
    digest: 46559922ebb4c773d8df8ab29e30efa36c2f5d2215aeb1fb24149edd21b12a80
    keywords:
    - ros2
    - dynamic-composition
    - rclpy-components
    - canonical
    maintainers:
    - email: mmateo@cigip.upv.es
      name: Miguel-Angel-Mateo-Casali
    name: ros2-dynamic-canonical
    type: application
    urls:
    - https://cigip-upv.github.io/Kubernetes-deployment-patterns/charts/ros2-dynamic-canonical-1.0.5.tgz
    version: 1.0.5
