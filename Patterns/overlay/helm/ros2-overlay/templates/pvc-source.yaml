{{- /*
overlay-source PVC — the cloud-side storage for the Overlay pattern.

LIFECYCLE:
  1. Helm install begins.
  2. Helm renders all templates (including this one and the pre-install Job).
  3. Pre-install hooks run, sorted by hook-weight ASCENDING:
       weight=-1  → THIS PVC is created first
       weight=0   → the pre-install Job is created next
  4. Job pod schedules on kb2 (nodeSelector). local-path-provisioner sees
     the consumer, creates the underlying volume on kb2's filesystem, and
     BINDS the PVC to that node.
  5. Job populates /pvc/overlay/{version}/install + huggingface_cache + ...
  6. Job exits successfully → hook-delete-policy cleans the Job pod.
  7. Helm continues with regular templates (nginx Deployment, StatefulSet,
     dashboard, etc.). nginx mounts THIS PVC read-only on kb2.

PERSISTENCE:
  resource-policy: keep makes Helm NOT delete this PVC on `helm uninstall`.
  This realizes the OTA model from the paper: when a robot/cluster operator
  uninstalls the chart, the overlay content stays on the cloud node, ready
  to serve the next chart install (potentially of a different version).
  Manual cleanup: kubectl delete pvc <name>.

WHY HOOKS:
  Helm pre-install hooks execute AFTER template rendering but BEFORE regular
  resources are created. If this PVC weren't a hook, it wouldn't exist when
  the Job runs (also a pre-install hook), and the Job would fail to start
  with "PVC not found".

NODE AFFINITY:
  K3s default storageClass `local-path` uses volumeBindingMode:
  WaitForFirstConsumer. This means: no node affinity is set on the PVC
  itself. The first Pod to consume it determines the node where the volume
  is created. Since the Job has `nodeSelector: kb2`, the volume lands on
  kb2 — and any later consumer (nginx) MUST also be on kb2.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ros2-overlay.fullname" . }}-{{ .Values.overlaySource.pvcName }}
  labels:
    {{- include "ros2-overlay.labels" . | nindent 4 }}
    component: overlay-source
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-1"
    "helm.sh/resource-policy": "keep"
spec:
  accessModes:
    - {{ .Values.overlaySource.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.overlaySource.storageClass | default "local-path" }}
  resources:
    requests:
      storage: {{ .Values.overlaySource.size | default "30Gi" }}
