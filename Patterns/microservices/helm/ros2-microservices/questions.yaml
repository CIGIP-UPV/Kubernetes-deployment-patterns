questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: images.camera.tag
    label: "Camera Image Tag"
    description: "Docker image tag for the camera driver"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  - variable: images.yolo.tag
    label: "YOLO Image Tag"
    description: "Docker image tag for the YOLO detector"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  # ── Cloud-Edge Topology ──────────────────────────────────────────
  - variable: camera.nodeHostname
    label: "Camera Node (Edge)"
    description: "Hostname of the edge node where the camera driver runs"
    type: enum
    default: "worker1-kb2"
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Node Placement"

  - variable: yolo.nodeHostname
    label: "YOLO Node (Cloud)"
    description: "Hostname of the cloud node where YOLO inference runs"
    type: enum
    default: "kb2"
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS (Scenario)"
    description: "Frame rate: S1=10 Hz, S2=20 Hz, S3=30 Hz"
    type: enum
    default: 10
    required: true
    options:
      - 10
      - 20
      - 30
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: true
    group: "Camera"

  - variable: camera.mountVideoDevice
    label: "Mount /dev/video0"
    description: "Mount the physical camera device into the camera container (required for real camera)"
    type: boolean
    default: false
    show_if: "camera.syntheticMode=false"
    group: "Camera"

  - variable: yolo.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: yolo.filterClasses
    label: "Filter Detection Classes"
    description: "COCO class IDs to detect (empty = all 80 classes). Examples: '0' = person only, '0,16,17' = person+dog+cat"
    type: string
    default: ""
    group: "Experiment"

  # ── Benchmark Probe ──────────────────────────────────────────────
  - variable: benchmark.enabled
    label: "Run Benchmark Probe"
    description: "Launch a Job that collects latency, inference time and FPS metrics after deployment"
    type: boolean
    default: false
    group: "Benchmark"

  - variable: benchmark.durationSeconds
    label: "Probe Duration (seconds)"
    description: "How long the benchmark probe listens for ROS 2 metrics"
    type: enum
    default: 120
    show_if: "benchmark.enabled=true"
    options:
      - 60
      - 120
      - 180
      - 300
    group: "Benchmark"

  - variable: benchmark.initialWaitSeconds
    label: "Initial Wait (seconds)"
    description: "Seconds to wait for the main app to start before probing"
    type: enum
    default: 60
    show_if: "benchmark.enabled=true"
    options:
      - 30
      - 60
      - 90
      - 120
    group: "Benchmark"

  - variable: benchmark.httpPort
    label: "Results HTTP Port"
    description: "Port for the HTTP file server to download benchmark results (summary.json, latency.csv, inference.csv)"
    type: int
    default: 9999
    show_if: "benchmark.enabled=true"
    group: "Benchmark"

  - variable: yolo.conf
    label: "YOLO Confidence Threshold"
    description: "Minimum confidence for object detection"
    type: enum
    default: 0.25
    options:
      - 0.10
      - 0.25
      - 0.50
      - 0.75
    group: "Experiment"

  # ── CycloneDDS ──────────────────────────────────────────
  - variable: cyclonedds.enabled
    label: "Enable CycloneDDS Unicast"
    description: "Enable CycloneDDS for ROS 2 communication between microservices"
    type: boolean
    default: true
    group: "CycloneDDS"

  - variable: cyclonedds.allowMulticast
    label: "Allow Multicast"
    description: "Enable multicast for DDS discovery (false = unicast only)"
    type: enum
    default: "false"
    options:
      - "true"
      - "false"
    show_if: "cyclonedds.enabled=true"
    group: "CycloneDDS"

  # ── Dashboard ────────────────────────────────────────────
  - variable: dashboard.enabled
    label: "Enable Dashboard"
    description: "Deploy the ROS 2 dashboard for visualization and monitoring"
    type: boolean
    default: true
    group: "Dashboard"

  - variable: dashboard.image.tag
    label: "Dashboard Image Tag"
    description: "Docker image tag for the dashboard"
    type: string
    default: "latest"
    show_if: "dashboard.enabled=true"
    required: true
    group: "Dashboard"

  - variable: dashboard.nodeHostname
    label: "Dashboard Node (Cloud)"
    description: "Hostname of the cloud node where the dashboard runs"
    type: enum
    default: ""
    show_if: "dashboard.enabled=true"
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Dashboard"

  - variable: dashboard.service.type
    label: "Dashboard Service Type"
    description: "Kubernetes service type for dashboard access"
    type: enum
    default: "NodePort"
    show_if: "dashboard.enabled=true"
    options:
      - "NodePort"
      - "ClusterIP"
    group: "Dashboard"

  - variable: dashboard.service.httpNodePort
    label: "Dashboard HTTP NodePort (optional)"
    description: "Specific NodePort for HTTP (leave empty for auto-assignment)"
    type: int
    default: ""
    show_if: "dashboard.enabled=true AND dashboard.service.type=NodePort"
    required: false
    group: "Dashboard"

  - variable: dashboard.service.wsNodePort
    label: "Dashboard WebSocket NodePort (optional)"
    description: "Specific NodePort for WebSocket (leave empty for auto-assignment)"
    type: int
    default: ""
    show_if: "dashboard.enabled=true AND dashboard.service.type=NodePort"
    required: false
    group: "Dashboard"
