images:
  camera:
    repository: gitlab-cigip.alc.upv.es:5050/cigip/patrones-kubernetes/ros2-camera
    tag: latest
    pullPolicy: Always
  yolo:
    repository: gitlab-cigip.alc.upv.es:5050/cigip/patrones-kubernetes/ros2-yolo
    tag: latest
    pullPolicy: Always
  llava:
    repository: gitlab-cigip.alc.upv.es:5050/cigip/patrones-kubernetes/ros2-llava
    tag: latest
    pullPolicy: Always
  voxtral:
    repository: gitlab-cigip.alc.upv.es:5050/cigip/patrones-kubernetes/ros2-voxtral
    tag: latest
    pullPolicy: Always

imagePullSecretName: regcred

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp
  localhostOnly: "0"

camera:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  # Pin to edge (Jetson) by architecture. Used only if nodeHostname/nodeSelector are empty.
  nodeArch: "arm64"
  tolerations: []
  affinity: {}
  device: /dev/video0
  width: 1280
  height: 720
  fps: 0  # 0 = unlimited (native camera rate); >0 = limit to N FPS
  frameId: camera
  syntheticMode: false
  mountVideoDevice: true
  resources: {}

yolo:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  # Pin to edge (Jetson) — YOLO needs GPU, only available on arm64 edge node.
  nodeArch: "arm64"
  tolerations: []
  affinity: {}
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "true"
  publishMetrics: "true"
  filterClasses: ""  # "" = all 80 COCO classes, "0" = person only, "0,16,17" = person+dog+cat
  resources: {}

llava:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  # Pin to edge (Jetson) — LLaVA needs GPU, only available on arm64 edge node.
  nodeArch: "arm64"
  tolerations: []
  affinity: {}
  modelId: llava-hf/llava-1.5-7b-hf
  triggerOnYolo: true
  yoloTriggerIntervalS: 8.0
  maxNewTokens: 150
  load4bit: true
  resources: {}

voxtral:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  # Pin to edge (Jetson) — voxtral lives on the edge alongside the other robot
  # nodes. Even in Phase 1 (no GPU), keep it on arm64 to avoid stranding on
  # cloud nodes that don't have the nvidia runtime registered.
  nodeArch: "arm64"
  tolerations: []
  affinity: {}
  audioMode: true  # Audio + GPU inference enabled (FP16 on Jetson)
  modelId: mistralai/Voxtral-Mini-4B-Realtime-2602
  resources: {}
  # Voxtral runs on the Jetson edge node with GPU acceleration (FP16).
  # The pod uses the nvidia runtime and is pinned to arm64 via nodeArch above.
  gpu:
    enabled: true

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms
  llavaResponse: /llava/response
  llavaLatency: /llava/metrics_latency_ms
  llavaInference: /llava/metrics_inference_ms
  llavaTrigger: /llava/trigger
  voiceCommand: /voice/command
  voiceTranscript: /voice/transcript
  voiceResponse: /voice/response
  voiceLatency: /voice/metrics_latency_ms

benchmark:
  enabled: false
  durationSeconds: 120
  initialWaitSeconds: 60
  httpPort: 9999
  ttlSecondsAfterFinished: 3600

# ── NVIDIA GPU (Jetson AGX Orin) ──
# requestGpuResource is false by default for microservices because multiple
# pods share the single Jetson GPU. The env vars + runtimeClassName are enough.
# Set to true only if GPU time-slicing is configured in the device plugin.
gpu:
  enabled: true
  runtimeClassName: nvidia
  visibleDevices: "all"
  driverCapabilities: "compute,utility"
  requestGpuResource: false
  count: 1

# ── CycloneDDS Unicast (cloud-edge communication) ──
cyclonedds:
  enabled: true
  allowMulticast: "false"
  extraPeers: []  # Additional peer addresses (e.g., other charts' StatefulSets)

# ── Dashboard (cloud-side observability) ──
dashboard:
  enabled: true
  pattern: microservices  # rendered into dashboard.html via Helm replace of __PATTERN__
  image:
    repository: gitlab-cigip.alc.upv.es:5050/cigip/patrones-kubernetes/ros2-dashboard
    tag: latest
    pullPolicy: Always
  nodeHostname: ""  # Pin to cloud node (e.g., worker1-kb2)
  # Architecture selector when nodeHostname is empty. Use amd64 for kb2,
  # arm64 for edgenode01. Avoids scheduling an amd64 image on arm64 node
  # (or vice-versa), which causes "exec format error".
  nodeArch: "amd64"
  resources: {}
  service:
    type: NodePort
    httpNodePort: 31406
    wsNodePort: 31407

nameOverride: ""
fullnameOverride: ""
