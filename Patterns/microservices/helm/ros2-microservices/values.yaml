images:
  camera:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-camera
    tag: v1
    pullPolicy: IfNotPresent
  yolo:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-yolo
    tag: v1
    pullPolicy: IfNotPresent

imagePullSecretName: regcred

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp
  localhostOnly: "0"

network:
  hostNetwork: true

camera:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  device: /dev/video0
  width: 1280
  height: 720
  fps: 10
  frameId: camera
  syntheticMode: true
  mountVideoDevice: false
  resources: {}

yolo:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "false"
  publishMetrics: "true"
  resources: {}

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms

benchmark:
  enabled: false
  durationSeconds: 120
  initialWaitSeconds: 60
  httpPort: 9999
  ttlSecondsAfterFinished: 3600

nameOverride: ""
fullnameOverride: ""
