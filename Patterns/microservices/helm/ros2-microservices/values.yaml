images:
  camera:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-camera
    tag: latest
    pullPolicy: Always
  yolo:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-yolo
    tag: latest
    pullPolicy: Always

imagePullSecretName: regcred

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp
  localhostOnly: "0"

camera:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  device: /dev/video0
  width: 1280
  height: 720
  fps: 0  # 0 = unlimited (native camera rate); >0 = limit to N FPS
  frameId: camera
  syntheticMode: false
  mountVideoDevice: true
  resources: {}

yolo:
  enabled: true
  nodeHostname: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "true"
  publishMetrics: "true"
  filterClasses: ""  # "" = all 80 COCO classes, "0" = person only, "0,16,17" = person+dog+cat
  resources: {}

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms

benchmark:
  enabled: false
  durationSeconds: 120
  initialWaitSeconds: 60
  httpPort: 9999
  ttlSecondsAfterFinished: 3600

# ── CycloneDDS Unicast (cloud-edge communication) ──
cyclonedds:
  enabled: true
  allowMulticast: "false"
  extraPeers: []  # Additional peer addresses (e.g., other charts' StatefulSets)

# ── Dashboard (cloud-side observability) ──
dashboard:
  enabled: true
  image:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-dashboard
    tag: latest
    pullPolicy: Always
  nodeHostname: ""  # Pin to cloud node (e.g., worker1-kb2)
  resources: {}
  service:
    type: NodePort
    httpNodePort: 31406
    wsNodePort: 31407

nameOverride: ""
fullnameOverride: ""
