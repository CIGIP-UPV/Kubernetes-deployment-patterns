images:
  camera:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-camera
    tag: v1
    pullPolicy: IfNotPresent
  yolo:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-yolo
    tag: v1
    pullPolicy: IfNotPresent
imagePullSecrets: []

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp
  localhostOnly: "0"

network:
  hostNetwork: true

camera:
  enabled: true
  # Edge placement: camera runs on the edge node (robot/sensor side)
  # Override with --set camera.nodeSelector.kubernetes\\.io/hostname=<edge-node>
  nodeSelector: {}
  tolerations: []
  affinity: {}
  device: /dev/video0
  width: 1280
  height: 720
  fps: 10
  frameId: camera
  syntheticMode: true
  mountVideoDevice: false
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

yolo:
  enabled: true
  # Cloud placement: AI inference runs on the cloud node (more resources)
  # Override with --set yolo.nodeSelector.kubernetes\\.io/hostname=<cloud-node>
  nodeSelector: {}
  tolerations: []
  affinity: {}
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "false"
  publishMetrics: "true"
  resources:
    requests: { cpu: 1000m, memory: 2Gi }
    limits: { cpu: 4000m, memory: 8Gi }

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms

nameOverride: ""
fullnameOverride: ""
