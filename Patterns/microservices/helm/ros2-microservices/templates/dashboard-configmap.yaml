{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ros2-microservices.fullname" . }}-dashboard-html
  labels:
    {{- include "ros2-microservices.labels" . | nindent 4 }}
    component: dashboard
data:
  index.html: |
{{ .Files.Get "files/dashboard.html" | indent 4 }}
{{- end }}
