{{- if .Values.yolo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ros2-microservices.fullname" . }}-yolo-peers
  labels:
    {{- include "ros2-microservices.labels" . | nindent 4 }}
    component: yolo
spec:
  clusterIP: None
  selector:
    app: yolo
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: dds
      port: 7400
      protocol: UDP
{{- end }}
