{{- if .Values.llava.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ros2-microservices.fullname" . }}-llava
  labels:
    {{- include "ros2-microservices.labels" . | nindent 4 }}
    pattern: microservices
    component: llava
spec:
  serviceName: {{ include "ros2-microservices.fullname" . }}-llava-peers
  replicas: 1
  selector:
    matchLabels:
      app: llava
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "ros2-microservices.labels" . | nindent 8 }}
        app: llava
        component: llava
        pattern: microservices
    spec:
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      {{- if .Values.llava.nodeHostname }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.llava.nodeHostname }}
      {{- else if .Values.llava.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.llava.nodeSelector | nindent 8 }}
      {{- else if .Values.llava.nodeArch }}
      nodeSelector:
        kubernetes.io/arch: {{ .Values.llava.nodeArch }}
      {{- end }}
      {{- if .Values.llava.affinity }}
      affinity:
        {{- toYaml .Values.llava.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.llava.tolerations }}
      tolerations:
        {{- toYaml .Values.llava.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      # ── Wait for DDS peers to be DNS-resolvable before the LLaVA process
      # initialises CycloneDDS. CycloneDDS resolves the unicast peer list
      # ONCE at startup; if a peer's headless-service DNS isn't published
      # yet (peer pod still pulling/scheduling), that peer is permanently
      # marked "unknown address" and DDS never connects to it. This loop
      # blocks the main container until camera/yolo/dashboard pods exist
      # in DNS, which is a few seconds after the StatefulSets are applied.
      initContainers:
        - name: wait-for-peers
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              FULLNAME="{{ include "ros2-microservices.fullname" . }}"
              NS="{{ .Release.Namespace }}"
              PEERS=""
              {{- if .Values.camera.enabled }}
              PEERS="$PEERS ${FULLNAME}-camera-0.${FULLNAME}-camera-peers.${NS}.svc.cluster.local"
              {{- end }}
              {{- if .Values.yolo.enabled }}
              PEERS="$PEERS ${FULLNAME}-yolo-0.${FULLNAME}-yolo-peers.${NS}.svc.cluster.local"
              {{- end }}
              {{- if .Values.dashboard.enabled }}
              PEERS="$PEERS ${FULLNAME}-dashboard-0.${FULLNAME}-dashboard-peers.${NS}.svc.cluster.local"
              {{- end }}
              for PEER in $PEERS; do
                echo "[init] Waiting for DDS peer DNS: $PEER"
                until nslookup "$PEER" >/dev/null 2>&1; do
                  echo "[init]   $PEER not resolvable yet, retrying in 3s..."
                  sleep 3
                done
                echo "[init]   $PEER resolved"
              done
              echo "[init] All peers resolved — starting LLaVA"
      containers:
        - name: llava
          image: "{{ .Values.images.llava.repository }}:{{ .Values.images.llava.tag }}"
          imagePullPolicy: {{ .Values.images.llava.pullPolicy }}
          env:
            - name: ROS_DOMAIN_ID
              value: {{ .Values.ros.domainId | quote }}
            - name: RMW_IMPLEMENTATION
              value: {{ .Values.ros.rmwImplementation | quote }}
            - name: ROS_LOCALHOST_ONLY
              value: {{ .Values.ros.localhostOnly | quote }}
            - name: LLAVA_MODEL_ID
              value: {{ .Values.llava.modelId | quote }}
            - name: LLAVA_TRIGGER_ON_YOLO
              value: {{ .Values.llava.triggerOnYolo | quote }}
            - name: LLAVA_YOLO_INTERVAL_S
              value: {{ .Values.llava.yoloTriggerIntervalS | quote }}
            - name: LLAVA_MAX_TOKENS
              value: {{ .Values.llava.maxNewTokens | quote }}
            - name: LLAVA_LOAD_4BIT
              value: {{ .Values.llava.load4bit | quote }}
            - name: IMAGE_TOPIC
              value: {{ .Values.topics.image | quote }}
            - name: DETECTIONS_TOPIC
              value: {{ .Values.topics.detections | quote }}
            - name: LLAVA_TRIGGER_TOPIC
              value: {{ .Values.topics.llavaTrigger | quote }}
            - name: LLAVA_RESPONSE_TOPIC
              value: {{ .Values.topics.llavaResponse | quote }}
            - name: LLAVA_LATENCY_TOPIC
              value: {{ .Values.topics.llavaLatency | quote }}
            - name: LLAVA_INFERENCE_TOPIC
              value: {{ .Values.topics.llavaInference | quote }}
            {{- if .Values.gpu.enabled }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: {{ .Values.gpu.visibleDevices | default "all" | quote }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: {{ .Values.gpu.driverCapabilities | default "compute,utility" | quote }}
            {{- end }}
            {{- if .Values.cyclonedds.enabled }}
            - name: CYCLONEDDS_URI
              value: "file:///etc/cyclonedds/cyclonedds.xml"
            {{- end }}
            {{- if .Values.hfCache.enabled }}
            - name: HF_HOME
              value: {{ .Values.hfCache.mountPath | quote }}
            - name: TRANSFORMERS_CACHE
              value: {{ .Values.hfCache.mountPath | quote }}
            - name: HF_HUB_CACHE
              value: {{ .Values.hfCache.mountPath | quote }}
            {{- end }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              source /opt/ros/humble/setup.bash
              if [ -f /opt/ros_ws/install/setup.bash ]; then
                source /opt/ros_ws/install/setup.bash
              fi
              ros2 run llava_pkg llava_node --ros-args \
                -p model_id:=${LLAVA_MODEL_ID} \
                -p image_topic:="${IMAGE_TOPIC}" \
                -p detection_topic:="${DETECTIONS_TOPIC}" \
                -p trigger_topic:="${LLAVA_TRIGGER_TOPIC}" \
                -p response_topic:="${LLAVA_RESPONSE_TOPIC}" \
                -p latency_topic:="${LLAVA_LATENCY_TOPIC}" \
                -p inference_topic:="${LLAVA_INFERENCE_TOPIC}" \
                -p trigger_on_yolo:=${LLAVA_TRIGGER_ON_YOLO} \
                -p yolo_trigger_interval_s:=$(printf "%.1f" "${LLAVA_YOLO_INTERVAL_S}") \
                -p max_new_tokens:=${LLAVA_MAX_TOKENS} \
                -p load_in_4bit:=${LLAVA_LOAD_4BIT} &
              LLAVA_PID=$!
              python3 /opt/scripts/resource_monitor.py &
              MONITOR_PID=$!
              wait -n ${LLAVA_PID} ${MONITOR_PID}
              exit 1
          resources:
            {{- if and .Values.gpu.enabled .Values.gpu.requestGpuResource }}
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count | default 1 }}
            {{- end }}
            {{- with .Values.llava.resources }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.cyclonedds.enabled }}
            - name: cyclonedds
              mountPath: /etc/cyclonedds
              readOnly: true
            {{- end }}
            {{- if .Values.gpu.enabled }}
            - name: sys-devices-platform
              mountPath: /sys/devices/platform
              readOnly: true
            {{- end }}
            {{- if .Values.hfCache.enabled }}
            - name: hf-cache
              mountPath: {{ .Values.hfCache.mountPath }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pgrep -f llava_node >/dev/null
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pgrep -f llava_node >/dev/null
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      {{- if or .Values.cyclonedds.enabled .Values.gpu.enabled .Values.hfCache.enabled }}
      volumes:
        {{- if .Values.cyclonedds.enabled }}
        - name: cyclonedds
          configMap:
            name: {{ include "ros2-microservices.fullname" . }}-cyclonedds
            items:
              - key: cyclonedds.xml
                path: cyclonedds.xml
        {{- end }}
        {{- if .Values.gpu.enabled }}
        - name: sys-devices-platform
          hostPath:
            path: /sys/devices/platform
            type: Directory
        {{- end }}
        {{- if .Values.hfCache.enabled }}
        - name: hf-cache
          hostPath:
            path: {{ .Values.hfCache.hostPath }}
            type: {{ .Values.hfCache.type | default "DirectoryOrCreate" }}
        {{- end }}
      {{- end }}
{{- end }}
