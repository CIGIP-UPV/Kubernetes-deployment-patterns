{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ros2-monolithic.fullname" . }}-dashboard
  labels:
    {{- include "ros2-monolithic.labels" . | nindent 4 }}
    component: dashboard
spec:
  serviceName: {{ include "ros2-monolithic.fullname" . }}-dashboard-peers
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "ros2-monolithic.name" . }}-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "ros2-monolithic.name" . }}-dashboard
        component: dashboard
        pattern: monolithic
        {{- include "ros2-monolithic.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      {{- if .Values.dashboard.nodeHostname }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.dashboard.nodeHostname }}
      {{- end }}
      # Dashboard is the last pod to start. We wait for:
      #   1. DNS of the main monolithic pod-0 (CycloneDDS resolves peers once
      #      at startup — if DNS fails, it never retries).
      #   2. A grace period for all internal nodes (camera, YOLO, LLaVA,
      #      Voxtral) to finish their heavy imports (transformers, torch,
      #      CUDA) and start publishing.
      initContainers:
        - name: wait-for-peers
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              PEER="{{ include "ros2-monolithic.fullname" . }}-0.{{ include "ros2-monolithic.fullname" . }}-peers.{{ .Release.Namespace }}.svc.cluster.local"
              echo "[init] Waiting for DDS peer DNS: $PEER"
              until nslookup "$PEER" >/dev/null 2>&1; do
                echo "[init] $PEER not resolvable yet, retrying in 3s..."
                sleep 3
              done
              echo "[init] Peer resolved: $PEER"
              GRACE={{ .Values.dashboard.peerReadyGraceSeconds | default 60 }}
              echo "[init] Waiting ${GRACE}s for camera/YOLO/LLaVA/Voxtral to finish loading models and start publishing"
              sleep "$GRACE"
              echo "[init] Ready to start rosbridge"
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          env:
            - name: ROS_DOMAIN_ID
              value: {{ .Values.ros.domainId | quote }}
            - name: RMW_IMPLEMENTATION
              value: {{ .Values.ros.rmwImplementation | quote }}
            - name: ROS_LOCALHOST_ONLY
              value: "0"
            {{- if .Values.cyclonedds.enabled }}
            - name: CYCLONEDDS_URI
              value: "file:///etc/cyclonedds/cyclonedds.xml"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ws
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: dashboard-html
              mountPath: /dashboard-cm
              readOnly: true
            {{- if .Values.cyclonedds.enabled }}
            - name: cyclonedds
              mountPath: /etc/cyclonedds
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: dashboard-html
          configMap:
            name: {{ include "ros2-monolithic.fullname" . }}-dashboard-html
        {{- if .Values.cyclonedds.enabled }}
        - name: cyclonedds
          configMap:
            name: {{ include "ros2-monolithic.fullname" . }}-cyclonedds
            items:
              - key: cyclonedds.xml
                path: cyclonedds.xml
        {{- end }}
{{- end }}
