replicaCount: 1

image:
  repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-monolithic
  tag: v1
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: regcred

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp
  localhostOnly: "0"

network:
  hostNetwork: true

camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 10
  frameId: camera
  syntheticMode: true
  mountVideoDevice: false

yolo:
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "false"
  publishMetrics: "true"
  startDelaySeconds: 2

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms

resources: {}

securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: false

nodeSelector: {}
affinity: {}
tolerations: []

service:
  enabled: false
  type: ClusterIP
  port: 8080

nameOverride: ""
fullnameOverride: ""
