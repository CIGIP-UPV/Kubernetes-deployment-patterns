questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: image.tag
    label: "Image Tag"
    description: "Docker image tag for the monolithic container"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  # ── Node Placement ──────────────────────────────────────────────
  - variable: nodeHostname
    label: "Deploy on Node"
    description: "Hostname of the node where the monolithic pod runs"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS"
    description: "0 = unlimited (native camera rate). For benchmarks: S1=10, S2=20, S3=30"
    type: enum
    default: "0"
    required: true
    options:
      - "40"
      - "0"
      - "10"
      - "20"
      - "30"
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.device
    label: "Camera Device"
    description: "Path del dispositivo de cámara (e.g. /dev/video0, /dev/video1)"
    type: string
    default: "/dev/video0"
    group: "Camera"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: false
    group: "Camera"

  - variable: yolo.publishDebugImage
    label: "Publish Debug Image"
    description: "Publish annotated YOLO detection image (required for dashboard video feed)"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: yolo.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: yolo.filterClasses
    label: "Filter Detection Classes"
    description: "COCO class IDs to detect (empty = all 80 classes). Examples: '0' = person only, '0,16,17' = person+dog+cat"
    type: string
    default: ""
    group: "Experiment"


  # ── Dashboard (Cloud Observability) ─────────────────────────────
  - variable: dashboard.enabled
    label: "Enable Dashboard"
    description: "Deploy a web dashboard to visualize YOLO detections and metrics from the cloud"
    type: boolean
    default: true
    group: "Dashboard"

  - variable: dashboard.nodeHostname
    label: "Dashboard Node"
    description: "Cloud node where the dashboard runs (leave empty for any node)"
    type: enum
    default: ""
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.image.tag
    label: "Dashboard Image Tag"
    description: "Docker image tag for the dashboard container"
    type: string
    default: "latest"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.httpNodePort
    label: "Dashboard HTTP NodePort"
    description: "Fixed NodePort for web UI (30000-32767)."
    type: int
    default: 31406
    required: false
    show_if: "dashboard.enabled=true&&dashboard.service.type=NodePort"
    group: "Dashboard"

  - variable: dashboard.service.wsNodePort
    label: "Dashboard WebSocket NodePort"
    description: "Fixed NodePort for rosbridge WebSocket (30000-32767)."
    type: int
    default: 31407
    required: false
    show_if: "dashboard.enabled=true&&dashboard.service.type=NodePort"
    group: "Dashboard"

  # ── Benchmark Probe ──────────────────────────────────────────────
  - variable: benchmark.enabled
    label: "Run Benchmark Probe"
    description: "Launch a Job that collects latency, inference time and FPS metrics after deployment"
    type: boolean
    default: false
    group: "Benchmark"

  - variable: benchmark.durationSeconds
    label: "Probe Duration (seconds)"
    description: "How long the benchmark probe listens for ROS 2 metrics"
    type: enum
    default: 120
    show_if: "benchmark.enabled=true"
    options:
      - 60
      - 120
      - 180
      - 300
    group: "Benchmark"

  - variable: benchmark.initialWaitSeconds
    label: "Initial Wait (seconds)"
    description: "Seconds to wait for the main app to start before probing"
    type: enum
    default: 60
    show_if: "benchmark.enabled=true"
    options:
      - 30
      - 60
      - 90
      - 120
    group: "Benchmark"

  - variable: benchmark.httpPort
    label: "Results HTTP Port"
    description: "Port for the HTTP file server to download benchmark results (summary.json, latency.csv, inference.csv)"
    type: int
    default: 9999
    show_if: "benchmark.enabled=true"
    group: "Benchmark"

  - variable: yolo.conf
    label: "YOLO Confidence Threshold"
    description: "Minimum confidence for object detection"
    type: enum
    default: 0.25
    options:
      - 0.10
      - 0.25
      - 0.50
      - 0.75
    group: "Experiment"

  # ── LLaVA — Visual Reasoning ─────────────────────────────────────
  - variable: llava.enabled
    label: "Enable LLaVA"
    description: "Deploy LLaVA-1.5-7b for visual scene understanding and reasoning"
    type: boolean
    default: true
    group: "LLaVA — Razonamiento Visual"

  - variable: llava.triggerOnYolo
    label: "Trigger on YOLO Detection"
    description: "Automatically analyze scene when YOLO detects objects"
    type: boolean
    default: true
    show_if: "llava.enabled=true"
    group: "LLaVA — Razonamiento Visual"

  - variable: llava.yoloTriggerIntervalS
    label: "YOLO Trigger Interval (s)"
    description: "Minimum seconds between YOLO-triggered LLaVA inferences (GPU throttle)"
    type: enum
    default: 8
    show_if: "llava.enabled=true&&llava.triggerOnYolo=true"
    options:
      - 5
      - 8
      - 15
      - 30
    group: "LLaVA — Razonamiento Visual"

  - variable: llava.load4bit
    label: "4-bit Quantization"
    description: "Load LLaVA in 4-bit (reduces VRAM from ~14GB to ~4GB, requires bitsandbytes)"
    type: boolean
    default: true
    show_if: "llava.enabled=true"
    group: "LLaVA — Razonamiento Visual"

  - variable: llava.maxNewTokens
    label: "Max Response Tokens"
    description: "Maximum tokens LLaVA generates per inference (longer = slower)"
    type: enum
    default: 150
    show_if: "llava.enabled=true"
    options:
      - 50
      - 100
      - 150
      - 250
    group: "LLaVA — Razonamiento Visual"

  # ── Voxtral — Voice Interaction ──────────────────────────────────
  - variable: voxtral.enabled
    label: "Enable Voxtral"
    description: "Deploy Voxtral-Mini-4B for human-robot voice interaction"
    type: boolean
    default: true
    group: "Voxtral — Interacción por Voz"

  - variable: voxtral.audioMode
    label: "Audio Mode"
    description: "false = text simulation (send commands via /voice/command topic) | true = microphone capture (requires USB mic mounted)"
    type: boolean
    default: false
    show_if: "voxtral.enabled=true"
    group: "Voxtral — Interacción por Voz"
