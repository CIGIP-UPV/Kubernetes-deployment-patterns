{{- /*
StatefulSet runtime — the edge pod that consumes the overlay tarball and
runs the four ROS 2 nodes (camera + YOLO + LLaVA + Voxtral).

ARCHITECTURE:
  Image:        ros2-base (~3 GB, ROS 2 + camera_driver + CUDA libs).
  Overlay:      downloaded at startup from the cloud-side overlay-server
                via curl + tar pipeline into emptyDir at /opt/overlay.
  Networking:   CycloneDDS unicast peers (this pod + dashboard pod), via
                the cyclonedds-configmap.

INIT CHAIN (sequential):
  1. wait-for-services: poll DNS until overlay-server (and dashboard, for
     CycloneDDS peering) are resolvable.
  2. overlay-sync: curl GET tarball from overlay-server | tar -xf into
     emptyDir /opt/overlay. Atomic stream — if curl or tar fails, the
     init container fails and the pod retries.

After init: main container `overlay-runtime` sources base + overlay setup
scripts, exports PYTHONPATH for /opt/overlay/python-deps, and launches
camera → YOLO → LLaVA → Voxtral as background processes.

GPU:
  Pod requests nvidia.com/gpu via runtimeClassName=nvidia. The Jetson
  PyTorch wheel inside /opt/overlay/python-deps/torch finds CUDA libs
  via LD_LIBRARY_PATH=/usr/local/cuda/lib64 (set in the ros2-base ENV).
  Audio system .so files in /opt/overlay/system-libs are also added to
  LD_LIBRARY_PATH so librosa/sounddevice load.

CYCLONEDDS:
  Runtime pod's CycloneDDS unicast peers include itself (so it can find
  its own publishers) and the dashboard pod. publishNotReadyAddresses on
  the headless services means DNS resolves during init — no race.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ros2-overlay-canonical.fullname" . }}
  labels:
    {{- include "ros2-overlay-canonical.labels" . | nindent 4 }}
    pattern: overlay-canonical
    component: runtime
spec:
  serviceName: {{ include "ros2-overlay-canonical.fullname" . }}-peers
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "ros2-overlay-canonical.name" . }}-runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "ros2-overlay-canonical.labels" . | nindent 8 }}
        app: {{ include "ros2-overlay-canonical.name" . }}-runtime
        pattern: overlay-canonical
        component: runtime
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.edge.name }}
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      {{- if .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}

      # ── Init containers (run sequentially) ─────────────────────────────
      initContainers:
        # 1) Wait for cloud-side services to publish DNS.
        #    publishNotReadyAddresses on the headless services makes
        #    DNS resolve as soon as pods get IPs (no need to wait for
        #    Ready), so this loop is typically <5 seconds.
        - name: wait-for-services
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              FULLNAME="{{ include "ros2-overlay-canonical.fullname" . }}"
              NS="{{ .Release.Namespace }}"
              OVERLAY_SVC="${FULLNAME}-{{ .Values.overlayServer.service.name }}.${NS}.svc.cluster.local"
              {{- if .Values.dashboard.enabled }}
              DASH_SVC="${FULLNAME}-dashboard-0.${FULLNAME}-dashboard-peers.${NS}.svc.cluster.local"
              {{- else }}
              DASH_SVC=""
              {{- end }}
              echo "[init] Waiting for overlay-server DNS: $OVERLAY_SVC"
              until nslookup "$OVERLAY_SVC" >/dev/null 2>&1; do
                echo "[init]   $OVERLAY_SVC not resolvable yet, retrying in 3s..."
                sleep 3
              done
              echo "[init]   $OVERLAY_SVC resolved"
              if [ -n "$DASH_SVC" ]; then
                echo "[init] Waiting for dashboard DNS: $DASH_SVC"
                until nslookup "$DASH_SVC" >/dev/null 2>&1; do
                  echo "[init]   $DASH_SVC not resolvable yet, retrying in 3s..."
                  sleep 3
                done
                echo "[init]   $DASH_SVC resolved"
              fi
              echo "[init] All DNS targets resolved — proceeding to overlay sync"

        # 2) Download the overlay tarball from overlay-server and extract.
        #    Streamed pipeline: curl | tar — no intermediate file, ~17 GB
        #    flows through pipe directly into emptyDir.
        - name: overlay-sync
          image: "{{ .Values.overlaySync.image.repository }}:{{ .Values.overlaySync.image.tag }}"
          imagePullPolicy: {{ .Values.overlaySync.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eo pipefail
              # Install curl (alpine doesn't include it by default)
              apk add --no-cache curl >/dev/null

              FULLNAME="{{ include "ros2-overlay-canonical.fullname" . }}"
              NS="{{ .Release.Namespace }}"
              VERSION={{ include "ros2-overlay-canonical.overlayVersion" . | quote }}
              OVERLAY_SVC="${FULLNAME}-{{ .Values.overlayServer.service.name }}.${NS}.svc.cluster.local"
              PORT={{ .Values.overlayServer.service.port | default 80 }}
              URL="http://${OVERLAY_SVC}:${PORT}/overlay/${VERSION}.tar"
              TARGET=/opt/overlay

              echo "[sync] Source: ${URL}"
              echo "[sync] Target: ${TARGET}"

              # If overlay is already extracted (idempotent re-run, container
              # restart), skip. emptyDir is pod-lifetime so this only matters
              # if init container re-runs on the same pod.
              if [ -f "${TARGET}/install/setup.bash" ]; then
                echo "[sync] Overlay already extracted at ${TARGET}, skipping download"
                ls -la "${TARGET}/"
                exit 0
              fi

              # Validate server is reachable (catches misconfig early)
              echo "[sync] Probing server availability..."
              curl -fsI --max-time 10 "http://${OVERLAY_SVC}:${PORT}/" \
                   -o /dev/null \
                || { echo "[sync] FATAL: overlay-server unreachable"; exit 1; }
              echo "[sync] Server OK. Downloading + extracting tarball..."

              # Streamed download + extract. set -o pipefail above ensures
              # that if curl fails mid-stream, the script exits non-zero.
              # --max-time 1800 = 30 min budget for the full transfer.
              mkdir -p "${TARGET}"
              curl -fSL --max-time {{ .Values.overlaySync.timeoutSeconds | default 1800 }} \
                   "${URL}" \
                | tar -xf - -C "${TARGET}"

              echo "[sync] Extraction complete. Contents:"
              ls -la "${TARGET}/"
              echo "[sync] Sizes:"
              du -sh "${TARGET}"/install        2>/dev/null || true
              du -sh "${TARGET}"/python-deps    2>/dev/null || true
              du -sh "${TARGET}"/huggingface_cache 2>/dev/null || true
              du -sh "${TARGET}"/models         2>/dev/null || true
              du -sh "${TARGET}"/system-libs    2>/dev/null || true
              echo "[sync] Done."
          volumeMounts:
            - name: overlay-mount
              mountPath: /opt/overlay

      # ── Main container ─────────────────────────────────────────────────
      containers:
        - name: overlay-runtime
          image: "{{ .Values.images.base.repository }}:{{ .Values.images.base.tag }}"
          imagePullPolicy: {{ .Values.images.base.pullPolicy }}
          {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
          securityContext:
            privileged: true
          {{- end }}
          env:
            # ── ROS 2 ──
            - name: ROS_DOMAIN_ID
              value: {{ .Values.ros.domainId | quote }}
            - name: RMW_IMPLEMENTATION
              value: {{ .Values.ros.rmwImplementation | quote }}
            - name: ROS_LOCALHOST_ONLY
              value: {{ .Values.ros.localhostOnly | quote }}
            {{- if .Values.cyclonedds.enabled }}
            - name: CYCLONEDDS_URI
              value: "file:///etc/cyclonedds/cyclonedds.xml"
            {{- end }}
            # ── Camera ──
            - name: CAMERA_DEVICE
              value: {{ .Values.camera.device | quote }}
            - name: CAMERA_WIDTH
              value: {{ .Values.camera.width | quote }}
            - name: CAMERA_HEIGHT
              value: {{ .Values.camera.height | quote }}
            - name: CAMERA_FPS
              value: {{ .Values.camera.fps | quote }}
            - name: CAMERA_FRAME_ID
              value: {{ .Values.camera.frameId | quote }}
            - name: CAMERA_SYNTHETIC_MODE
              value: {{ .Values.camera.syntheticMode | quote }}
            - name: IMAGE_TOPIC
              value: {{ .Values.topics.image | quote }}
            # ── YOLO ──
            - name: YOLO_MODEL_PATH
              value: {{ .Values.yolo.modelPath | quote }}
            - name: YOLO_CONF
              value: {{ .Values.yolo.conf | quote }}
            - name: YOLO_PUBLISH_DEBUG
              value: {{ .Values.yolo.publishDebugImage | quote }}
            - name: YOLO_PUBLISH_METRICS
              value: {{ .Values.yolo.publishMetrics | quote }}
            - name: YOLO_FILTER_CLASSES
              value: {{ .Values.yolo.filterClasses | toString | quote }}
            - name: YOLO_START_DELAY
              value: {{ .Values.yolo.startDelaySeconds | quote }}
            - name: DETECTIONS_TOPIC
              value: {{ .Values.topics.detections | quote }}
            - name: DEBUG_IMAGE_TOPIC
              value: {{ .Values.topics.debugImage | quote }}
            - name: LATENCY_TOPIC
              value: {{ .Values.topics.latency | quote }}
            - name: INFERENCE_TOPIC
              value: {{ .Values.topics.inference | quote }}
            # ── LLaVA ──
            - name: LLAVA_ENABLED
              value: {{ .Values.llava.enabled | quote }}
            - name: LLAVA_MODEL_ID
              value: {{ .Values.llava.modelId | quote }}
            - name: LLAVA_TRIGGER_ON_YOLO
              value: {{ .Values.llava.triggerOnYolo | quote }}
            - name: LLAVA_YOLO_INTERVAL_S
              value: {{ .Values.llava.yoloTriggerIntervalS | quote }}
            - name: LLAVA_MAX_TOKENS
              value: {{ .Values.llava.maxNewTokens | quote }}
            - name: LLAVA_LOAD_4BIT
              value: {{ .Values.llava.load4bit | quote }}
            - name: LLAVA_START_DELAY
              value: {{ .Values.llava.startDelaySeconds | quote }}
            - name: LLAVA_TRIGGER_TOPIC
              value: {{ .Values.topics.llavaTrigger | quote }}
            - name: LLAVA_RESPONSE_TOPIC
              value: {{ .Values.topics.llavaResponse | quote }}
            - name: LLAVA_LATENCY_TOPIC
              value: {{ .Values.topics.llavaLatency | quote }}
            - name: LLAVA_INFERENCE_TOPIC
              value: {{ .Values.topics.llavaInference | quote }}
            # ── Voxtral ──
            - name: VOXTRAL_ENABLED
              value: {{ .Values.voxtral.enabled | quote }}
            - name: VOXTRAL_AUDIO_MODE
              value: {{ .Values.voxtral.audioMode | quote }}
            - name: VOXTRAL_MODEL_ID
              value: {{ .Values.voxtral.modelId | quote }}
            - name: VOICE_COMMAND_TOPIC
              value: {{ .Values.topics.voiceCommand | quote }}
            - name: VOICE_TRANSCRIPT_TOPIC
              value: {{ .Values.topics.voiceTranscript | quote }}
            - name: VOICE_RESPONSE_TOPIC
              value: {{ .Values.topics.voiceResponse | quote }}
            - name: VOICE_LATENCY_TOPIC
              value: {{ .Values.topics.voiceLatency | quote }}
            # ── HuggingFace cache (in synced overlay) ──
            - name: HF_HOME
              value: "/opt/overlay/huggingface_cache"
            - name: HF_HUB_CACHE
              value: "/opt/overlay/huggingface_cache"
            - name: TRANSFORMERS_CACHE
              value: "/opt/overlay/huggingface_cache"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            {{- if .Values.gpu.enabled }}
            # ── NVIDIA GPU ──
            - name: NVIDIA_VISIBLE_DEVICES
              value: {{ .Values.gpu.visibleDevices | default "all" | quote }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: {{ .Values.gpu.driverCapabilities | default "compute,utility" | quote }}
            {{- end }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              echo "[runtime] Sourcing ROS 2 + base workspace..."
              source /opt/ros/humble/setup.bash
              source /opt/base_ws/install/setup.bash

              echo "[runtime] Sourcing overlay workspace..."
              source /opt/overlay/install/setup.bash

              # ── Workaround for ros2-overlay-pack <= 1.0.x ──
              # pip pulls nvidia-cuda-runtime-cu13 + nvidia-cudnn-cu13 etc.
              # as transitive deps of ultralytics/transformers. Their .so
              # files install under /opt/overlay/python-deps/nvidia/<lib>/
              # as a SHARED namespace package, so deleting the .dist-info
              # dirs alone is not enough — we must wipe the nvidia/ dir
              # itself. The Jetson PyTorch wheel does NOT depend on these
              # (it links libcuda from /usr/local/cuda/lib64 inherited
              # from ros2-base).
              echo "[runtime] Stripping nvidia-cu13 datacenter libs from overlay..."
              rm -rf /opt/overlay/python-deps/nvidia      2>/dev/null || true
              rm -rf /opt/overlay/python-deps/cuda_toolkit 2>/dev/null || true
              # Also remove any *.dist-info / *.libs folders that referenced them
              find /opt/overlay/python-deps -maxdepth 1 -type d \
                \( -name "nvidia_*" -o -name "cuda_toolkit*" \) \
                -exec rm -rf {} + 2>/dev/null || true
              echo "[runtime] Remaining python-deps top-level (nvidia/cuda):"
              ls /opt/overlay/python-deps 2>/dev/null | grep -i -E "nvidia|cuda" || \
                echo "  (none — clean)"

              # PYTHONPATH for the overlay's pip --target site-packages
              # (PyTorch, transformers, accelerate, ultralytics, etc.)
              export PYTHONPATH="/opt/overlay/python-deps:${PYTHONPATH}"

              # LD_LIBRARY_PATH for the system libs we staged in the overlay
              # (libasound, libportaudio, libsndfile — needed by librosa,
              # sounddevice). Append to existing path (set in ros2-base ENV).
              export LD_LIBRARY_PATH="/opt/overlay/system-libs:${LD_LIBRARY_PATH}"

              echo "[runtime] Environment summary:"
              echo "  PYTHONPATH=${PYTHONPATH}"
              echo "  LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
              echo "  HF_HOME=${HF_HOME}"
              echo ""

              echo "[runtime] Starting resource_monitor..."
              python3 /opt/scripts/resource_monitor.py &
              RESMON_PID=$!

              echo "[runtime] Starting camera_driver..."
              ros2 run camera_driver_pkg camera_driver --ros-args \
                -p device:=${CAMERA_DEVICE} \
                -p width:=${CAMERA_WIDTH} \
                -p height:=${CAMERA_HEIGHT} \
                -p fps:=${CAMERA_FPS} \
                -p frame_id:=${CAMERA_FRAME_ID} \
                -p synthetic_mode:=${CAMERA_SYNTHETIC_MODE} \
                -p image_topic:=${IMAGE_TOPIC} &
              CAMERA_PID=$!

              sleep ${YOLO_START_DELAY}
              echo "[runtime] Starting yolo_detector..."
              ros2 run yolo_detector_pkg yolo_detector --ros-args \
                -p model_path:=${YOLO_MODEL_PATH} \
                -p conf:=${YOLO_CONF} \
                -p image_topic:=${IMAGE_TOPIC} \
                -p detections_topic:=${DETECTIONS_TOPIC} \
                -p debug_image_topic:=${DEBUG_IMAGE_TOPIC} \
                -p publish_debug_image:=${YOLO_PUBLISH_DEBUG} \
                -p publish_metrics:=${YOLO_PUBLISH_METRICS} \
                -p latency_topic:=${LATENCY_TOPIC} \
                -p inference_topic:=${INFERENCE_TOPIC} \
                -p filter_classes:="\"${YOLO_FILTER_CLASSES}\"" &
              YOLO_PID=$!

              if [ "${LLAVA_ENABLED}" = "true" ]; then
                sleep ${LLAVA_START_DELAY}
                echo "[runtime] Starting llava_node..."
                ros2 run llava_pkg llava_node --ros-args \
                  -p model_id:=${LLAVA_MODEL_ID} \
                  -p image_topic:=${IMAGE_TOPIC} \
                  -p detection_topic:=${DETECTIONS_TOPIC} \
                  -p trigger_topic:=${LLAVA_TRIGGER_TOPIC} \
                  -p response_topic:=${LLAVA_RESPONSE_TOPIC} \
                  -p latency_topic:=${LLAVA_LATENCY_TOPIC} \
                  -p inference_topic:=${LLAVA_INFERENCE_TOPIC} \
                  -p trigger_on_yolo:=${LLAVA_TRIGGER_ON_YOLO} \
                  -p yolo_trigger_interval_s:=$(printf "%.1f" "${LLAVA_YOLO_INTERVAL_S}") \
                  -p max_new_tokens:=${LLAVA_MAX_TOKENS} \
                  -p load_in_4bit:=${LLAVA_LOAD_4BIT} &
                LLAVA_PID=$!
              fi

              if [ "${VOXTRAL_ENABLED}" = "true" ]; then
                echo "[runtime] Starting voxtral_node..."
                ros2 run voxtral_pkg voxtral_node --ros-args \
                  -p audio_mode:=${VOXTRAL_AUDIO_MODE} \
                  -p model_id:=${VOXTRAL_MODEL_ID} \
                  -p command_topic:=${VOICE_COMMAND_TOPIC} \
                  -p transcript_topic:=${VOICE_TRANSCRIPT_TOPIC} \
                  -p response_topic:=${VOICE_RESPONSE_TOPIC} \
                  -p llava_trigger_topic:=${LLAVA_TRIGGER_TOPIC} \
                  -p llava_response_topic:=${LLAVA_RESPONSE_TOPIC} \
                  -p latency_topic:=${VOICE_LATENCY_TOPIC} &
                VOXTRAL_PID=$!
              fi

              echo "[runtime] All nodes launched. Waiting for any to exit..."
              wait -n ${CAMERA_PID} ${YOLO_PID} ${RESMON_PID} ${LLAVA_PID:-} ${VOXTRAL_PID:-}
              echo "[runtime] One process exited — pod will restart"
              exit 1
          resources:
            {{- if and .Values.gpu.enabled .Values.gpu.requestGpuResource }}
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count | default 1 }}
            {{- end }}
            {{- with .Values.resources }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: overlay-mount
              mountPath: /opt/overlay
              # Was readOnly: true. Switched to read-write so the runtime
              # cleanup (strip nvidia-cu13 datacenter libs) can write to
              # /opt/overlay/python-deps. Models and overlay packages are
              # still semantically immutable — no production code modifies
              # them — but pip's transitive datacenter libs need to be
              # purged after extraction to avoid CUDA driver conflicts on
              # Tegra. Once ros2-overlay-pack >= 1.0.7 ships with the
              # cleanup baked at build time, this can be reverted to RO.
              readOnly: false
            {{- if .Values.cyclonedds.enabled }}
            - name: cyclonedds
              mountPath: /etc/cyclonedds
              readOnly: true
            {{- end }}
            {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
            - name: video-device
              mountPath: {{ .Values.camera.device }}
            {{- end }}
            {{- if .Values.gpu.enabled }}
            # Sysfs hostPath so resource_monitor.py can read Jetson GPU load
            # (/sys/devices/platform/gpu.0/load) inside the container.
            - name: sys-devices-platform
              mountPath: /sys/devices/platform
              readOnly: true
            {{- end }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pgrep -f camera_driver >/dev/null && pgrep -f yolo_detector >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36   # 6 minutes max for camera+yolo to come up
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pgrep -f camera_driver >/dev/null && pgrep -f yolo_detector >/dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        # overlay-mount holds the extracted overlay (~17 GB on disk).
        # Two backends supported via overlayMount.kind:
        #   • emptyDir (default)  → pod-lifetime, lives on kubelet root-dir
        #   • hostPath            → persistent, pinned to a host path; useful
        #     when the kubelet root-dir is on a small disk (e.g. Jetson SD
        #     card) but the node has a larger SSD mounted elsewhere
        - name: overlay-mount
          {{- if eq (.Values.overlayMount.kind | default "emptyDir") "hostPath" }}
          hostPath:
            path: {{ .Values.overlayMount.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.cyclonedds.enabled }}
        - name: cyclonedds
          configMap:
            name: {{ include "ros2-overlay-canonical.fullname" . }}-cyclonedds
            items:
              - key: cyclonedds.xml
                path: cyclonedds.xml
        {{- end }}
        {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
        - name: video-device
          hostPath:
            path: {{ .Values.camera.device }}
            type: CharDevice
        {{- end }}
        {{- if .Values.gpu.enabled }}
        # Jetson sysfs paths used by resource_monitor.py to read GPU load.
        - name: sys-devices-platform
          hostPath:
            path: /sys/devices/platform
            type: Directory
        {{- end }}
