{{- if .Values.overlayServer.enabled }}
{{- /*
overlay-server Service — ClusterIP exposing the nginx pod's port 80.

The runtime StatefulSet's initContainer resolves this Service by DNS:
  http://{{ include "ros2-overlay-canonical.fullname" . }}-{{ .Values.overlayServer.service.name }}.{{ .Release.Namespace }}.svc.cluster.local/overlay/{version}.tar

NOT a NodePort: nobody outside the cluster needs access. The runtime pod
on edge talks to this service over the K3s internal network.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ros2-overlay-canonical.fullname" . }}-{{ .Values.overlayServer.service.name }}
  labels:
    {{- include "ros2-overlay-canonical.labels" . | nindent 4 }}
    component: overlay-server
spec:
  type: ClusterIP
  selector:
    app: {{ include "ros2-overlay-canonical.name" . }}-overlay-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.overlayServer.service.port | default 80 }}
      targetPort: http
      protocol: TCP
{{- end }}
