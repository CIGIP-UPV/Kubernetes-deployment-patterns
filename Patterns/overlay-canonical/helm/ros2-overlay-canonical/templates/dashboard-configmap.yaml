{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ros2-overlay-canonical.fullname" . }}-dashboard-html
  labels:
    {{- include "ros2-overlay-canonical.labels" . | nindent 4 }}
    component: dashboard
data:
  index.html: |
{{ .Files.Get "files/dashboard.html" | replace "__PATTERN__" (.Values.dashboard.pattern | default "overlay-canonical") | indent 4 }}
{{- end }}
