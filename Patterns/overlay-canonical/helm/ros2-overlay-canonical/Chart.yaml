apiVersion: v2
name: ros2-overlay-canonical
description: |
  Canonical Overlay Workspaces pattern for ROS 2 robotics on Kubernetes.

  Realizes the OTA cloud-edge delivery model from the paper:
    - ros2-base (immutable platform: ROS 2 + camera driver + CUDA)
    - ros2-overlay-pack (mutable AI layer: ML stack + nodes + models)
      delivered as an OCI carrier image, extracted by a Helm pre-install Job
      to a PVC on the cloud node, and synced via HTTP from an nginx sidecar
      to the edge node's runtime pod via initContainer.

  This canonical realisation strictly separates immutable base from mutable
  overlay so that AI updates only re-publish the overlay-pack carrier
  (~25 GB), keeping the ROS 2 base image (~2.2 GB) intact across releases.
type: application
version: 1.0.9
appVersion: humble
keywords:
  - ros2
  - overlay
  - cloud-edge
  - canonical
  - ota
annotations:
  # Rancher Apps: extend default timeout (10m) to 45m. Required because
  # overlay-canonical needs ~20-30 min cold-start: 67 GB image pull on
  # cloud + 17 GB cp to PVC + 17 GB HTTP sync to edge emptyDir.
  catalog.cattle.io/timeout: 45m
