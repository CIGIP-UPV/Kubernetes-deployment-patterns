questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: image.tag
    label: "Image Tag"
    description: "Docker image tag for the overlay container"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  # ── Node Placement ──────────────────────────────────────────────
  - variable: nodeHostname
    label: "Deploy on Node"
    description: "Hostname of the node where the overlay pod runs"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS (Scenario)"
    description: "Frame rate: S1=10 Hz, S2=20 Hz, S3=30 Hz"
    type: enum
    default: 10
    required: true
    options:
      - 10
      - 20
      - 30
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: true
    group: "Camera"

  - variable: camera.mountVideoDevice
    label: "Mount /dev/video0"
    description: "Mount the physical camera device into the container (required for real camera)"
    type: boolean
    default: false
    show_if: "camera.syntheticMode=false"
    group: "Camera"

  - variable: yolo.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: yolo.filterClasses
    label: "Filter Detection Classes"
    description: "COCO class IDs to detect (empty = all 80 classes). Examples: '0' = person only, '0,16,17' = person+dog+cat"
    type: string
    default: ""
    group: "Experiment"

  # ── CycloneDDS (Cloud-Edge Communication) ────────────────────────
  - variable: cyclonedds.enabled
    label: "Enable CycloneDDS Unicast"
    description: "Use CycloneDDS unicast peers for cross-node DDS communication (required for cloud-edge)"
    type: boolean
    default: true
    group: "DDS Network"

  - variable: cyclonedds.allowMulticast
    label: "Allow Multicast"
    description: "false = unicast peers only (recommended for cloud-edge), true = use multicast"
    type: enum
    default: "false"
    options:
      - "false"
      - "true"
    show_if: "cyclonedds.enabled=true"
    group: "DDS Network"

  # ── Dashboard (Cloud Observability) ─────────────────────────────
  - variable: dashboard.enabled
    label: "Enable Dashboard"
    description: "Deploy a web dashboard to visualize YOLO detections and metrics from the cloud"
    type: boolean
    default: true
    group: "Dashboard"

  - variable: dashboard.nodeHostname
    label: "Dashboard Node"
    description: "Cloud node where the dashboard runs (leave empty for any node)"
    type: enum
    default: ""
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.image.tag
    label: "Dashboard Image Tag"
    description: "Docker image tag for the dashboard container"
    type: string
    default: "latest"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.type
    label: "Dashboard Service Type"
    description: "NodePort to access from outside the cluster, ClusterIP for internal only"
    type: enum
    default: "NodePort"
    options:
      - "NodePort"
      - "ClusterIP"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.httpNodePort
    label: "Dashboard HTTP NodePort"
    description: "Fixed NodePort for web UI (30000-32767). Leave empty for auto-assign."
    type: int
    default: 31406
    required: false
    show_if: "dashboard.enabled=true&&dashboard.service.type=NodePort"
    group: "Dashboard"

  - variable: dashboard.service.wsNodePort
    label: "Dashboard WebSocket NodePort"
    description: "Fixed NodePort for rosbridge WebSocket (30000-32767). Leave empty for auto-assign."
    type: int
    default: 31407
    required: false
    show_if: "dashboard.enabled=true&&dashboard.service.type=NodePort"
    group: "Dashboard"

  # ── Benchmark Probe ──────────────────────────────────────────────
  - variable: benchmark.enabled
    label: "Run Benchmark Probe"
    description: "Launch a Job that collects latency, inference time and FPS metrics after deployment"
    type: boolean
    default: false
    group: "Benchmark"

  - variable: benchmark.durationSeconds
    label: "Probe Duration (seconds)"
    description: "How long the benchmark probe listens for ROS 2 metrics"
    type: enum
    default: 120
    show_if: "benchmark.enabled=true"
    options:
      - 60
      - 120
      - 180
      - 300
    group: "Benchmark"

  - variable: benchmark.initialWaitSeconds
    label: "Initial Wait (seconds)"
    description: "Seconds to wait for the main app to start before probing"
    type: enum
    default: 60
    show_if: "benchmark.enabled=true"
    options:
      - 30
      - 60
      - 90
      - 120
    group: "Benchmark"

  - variable: benchmark.httpPort
    label: "Results HTTP Port"
    description: "Port for the HTTP file server to download benchmark results (summary.json, latency.csv, inference.csv)"
    type: int
    default: 9999
    show_if: "benchmark.enabled=true"
    group: "Benchmark"

  - variable: yolo.conf
    label: "YOLO Confidence Threshold"
    description: "Minimum confidence for object detection"
    type: enum
    default: 0.25
    options:
      - 0.10
      - 0.25
      - 0.50
      - 0.75
    group: "Experiment"
