questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: image.tag
    label: "Image Tag"
    description: "Docker image tag for the overlay container"
    type: string
    default: "v1"
    required: true
    group: "Container Images"

  # ── Node Placement ──────────────────────────────────────────────
  - variable: nodeHostname
    label: "Deploy on Node"
    description: "Hostname of the node where the overlay pod runs"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS (Scenario)"
    description: "Frame rate: S1=10 Hz, S2=20 Hz, S3=30 Hz"
    type: enum
    default: 10
    required: true
    options:
      - 10
      - 20
      - 30
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: true
    group: "Camera"

  - variable: camera.mountVideoDevice
    label: "Mount /dev/video0"
    description: "Mount the physical camera device into the container (required for real camera)"
    type: boolean
    default: false
    show_if: "camera.syntheticMode=false"
    group: "Camera"

  - variable: yolo.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  # ── Benchmark Probe ──────────────────────────────────────────────
  - variable: benchmark.enabled
    label: "Run Benchmark Probe"
    description: "Launch a Job that collects latency, inference time and FPS metrics after deployment"
    type: boolean
    default: false
    group: "Benchmark"

  - variable: benchmark.durationSeconds
    label: "Probe Duration (seconds)"
    description: "How long the benchmark probe listens for ROS 2 metrics"
    type: enum
    default: 120
    show_if: "benchmark.enabled=true"
    options:
      - 60
      - 120
      - 180
      - 300
    group: "Benchmark"

  - variable: benchmark.initialWaitSeconds
    label: "Initial Wait (seconds)"
    description: "Seconds to wait for the main app to start before probing"
    type: enum
    default: 60
    show_if: "benchmark.enabled=true"
    options:
      - 30
      - 60
      - 90
      - 120
    group: "Benchmark"

  - variable: yolo.conf
    label: "YOLO Confidence Threshold"
    description: "Minimum confidence for object detection"
    type: enum
    default: 0.25
    options:
      - 0.10
      - 0.25
      - 0.50
      - 0.75
    group: "Experiment"
