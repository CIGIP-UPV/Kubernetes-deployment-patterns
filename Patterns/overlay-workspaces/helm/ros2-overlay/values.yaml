replicaCount: 1

image:
  repository: gitlab-cigip.alc.upv.es:5050/cigip/patrones-kubernetes/ros2-overlay
  tag: latest
  pullPolicy: Always

imagePullSecretName: regcred

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp

nodeHostname: ""
nodeSelector: {}
affinity: {}
tolerations: []

camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 0  # 0 = unlimited (native camera rate); >0 = limit to N FPS
  frameId: camera
  syntheticMode: false
  mountVideoDevice: true

yolo:
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "true"
  publishMetrics: "true"
  startDelaySeconds: 2
  filterClasses: ""  # "" = all 80 COCO classes, "0" = person only, "0,16,17" = person+dog+cat

llava:
  enabled: true
  modelId: llava-hf/llava-1.5-7b-hf
  triggerOnYolo: true
  yoloTriggerIntervalS: 8.0
  maxNewTokens: 150
  load4bit: true
  startDelaySeconds: 15  # wait for YOLO to be ready first

voxtral:
  enabled: true
  audioMode: false  # Phase 1: text simulation; Phase 2: set true + mount mic device
  modelId: mistralai/Voxtral-Mini-4B-Realtime-2602

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms
  llavaResponse: /llava/response
  llavaLatency: /llava/metrics_latency_ms
  llavaInference: /llava/metrics_inference_ms
  llavaTrigger: /llava/trigger
  voiceCommand: /voice/command
  voiceTranscript: /voice/transcript
  voiceResponse: /voice/response
  voiceLatency: /voice/metrics_latency_ms

# ── NVIDIA GPU (Jetson AGX Orin) ──
gpu:
  enabled: true
  runtimeClassName: nvidia-cdi
  visibleDevices: "all"
  driverCapabilities: "compute,utility"
  requestGpuResource: true
  count: 1

resources: {}

# ── CycloneDDS Unicast (cloud-edge communication) ──
cyclonedds:
  enabled: true
  allowMulticast: "false"
  extraPeers: []  # Additional peer addresses (e.g., other charts' StatefulSets)

# ── Dashboard (cloud-side observability) ──
dashboard:
  enabled: true
  image:
    repository: gitlab-cigip.alc.upv.es:5050/cigip/patrones-kubernetes/ros2-dashboard
    tag: latest
    pullPolicy: Always
  nodeHostname: ""  # Pin to cloud node (e.g., worker1-kb2)
  resources: {}
  service:
    type: NodePort
    httpNodePort: 31406
    wsNodePort: 31407

benchmark:
  enabled: false
  durationSeconds: 120
  initialWaitSeconds: 60
  httpPort: 9999
  ttlSecondsAfterFinished: 3600

nameOverride: ""
fullnameOverride: ""
