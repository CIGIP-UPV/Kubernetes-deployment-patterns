replicaCount: 1

image:
  repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-overlay
  tag: latest
  pullPolicy: Always

imagePullSecretName: regcred

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp

nodeHostname: ""
nodeSelector: {}
affinity: {}
tolerations: []

camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 10
  frameId: camera
  syntheticMode: true
  mountVideoDevice: false

yolo:
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "false"
  publishMetrics: "true"
  startDelaySeconds: 2
  filterClasses: ""  # "" = all 80 COCO classes, "0" = person only, "0,16,17" = person+dog+cat

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms

resources: {}

# ── CycloneDDS Unicast (cloud-edge communication) ──
cyclonedds:
  enabled: true
  allowMulticast: "false"
  extraPeers: []  # Additional peer addresses (e.g., other charts' StatefulSets)

# ── Dashboard (cloud-side observability) ──
dashboard:
  enabled: true
  image:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-dashboard
    tag: latest
    pullPolicy: Always
  nodeHostname: ""  # Pin to cloud node (e.g., worker1-kb2)
  resources: {}
  service:
    type: NodePort
    httpNodePort: ""
    wsNodePort: ""

benchmark:
  enabled: false
  durationSeconds: 120
  initialWaitSeconds: 60
  httpPort: 9999
  ttlSecondsAfterFinished: 3600

nameOverride: ""
fullnameOverride: ""
