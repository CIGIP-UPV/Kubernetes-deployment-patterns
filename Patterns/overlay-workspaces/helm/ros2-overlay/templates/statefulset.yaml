apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ros2-overlay.fullname" . }}
  labels:
    {{- include "ros2-overlay.labels" . | nindent 4 }}
    pattern: overlay-workspaces
spec:
  serviceName: {{ include "ros2-overlay.fullname" . }}-peers
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ros2-overlay.name" . }}
      pattern: overlay-workspaces
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "ros2-overlay.name" . }}
        pattern: overlay-workspaces
        {{- include "ros2-overlay.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      {{- if .Values.nodeHostname }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeHostname }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: overlay-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
          securityContext:
            privileged: true
          {{- end }}
          env:
            - name: ROS_DOMAIN_ID
              value: {{ .Values.ros.domainId | quote }}
            - name: RMW_IMPLEMENTATION
              value: {{ .Values.ros.rmwImplementation | quote }}
            - name: ROS_LOCALHOST_ONLY
              value: "0"
            - name: CAMERA_DEVICE
              value: {{ .Values.camera.device | quote }}
            - name: CAMERA_WIDTH
              value: {{ .Values.camera.width | quote }}
            - name: CAMERA_HEIGHT
              value: {{ .Values.camera.height | quote }}
            - name: CAMERA_FPS
              value: {{ .Values.camera.fps | quote }}
            - name: CAMERA_FRAME_ID
              value: {{ .Values.camera.frameId | quote }}
            - name: CAMERA_SYNTHETIC_MODE
              value: {{ .Values.camera.syntheticMode | quote }}
            - name: IMAGE_TOPIC
              value: {{ .Values.topics.image | quote }}
            - name: DETECTIONS_TOPIC
              value: {{ .Values.topics.detections | quote }}
            - name: DEBUG_IMAGE_TOPIC
              value: {{ .Values.topics.debugImage | quote }}
            - name: LATENCY_TOPIC
              value: {{ .Values.topics.latency | quote }}
            - name: INFERENCE_TOPIC
              value: {{ .Values.topics.inference | quote }}
            - name: YOLO_MODEL_PATH
              value: {{ .Values.yolo.modelPath | quote }}
            - name: YOLO_CONF
              value: {{ .Values.yolo.conf | quote }}
            - name: YOLO_PUBLISH_DEBUG
              value: {{ .Values.yolo.publishDebugImage | quote }}
            - name: YOLO_PUBLISH_METRICS
              value: {{ .Values.yolo.publishMetrics | quote }}
            - name: YOLO_FILTER_CLASSES
              value: {{ .Values.yolo.filterClasses | toString | quote }}
            - name: YOLO_START_DELAY
              value: {{ .Values.yolo.startDelaySeconds | quote }}
            # LLaVA visual reasoning
            - name: LLAVA_ENABLED
              value: {{ .Values.llava.enabled | quote }}
            - name: LLAVA_MODEL_ID
              value: {{ .Values.llava.modelId | quote }}
            - name: LLAVA_TRIGGER_ON_YOLO
              value: {{ .Values.llava.triggerOnYolo | quote }}
            - name: LLAVA_YOLO_INTERVAL_S
              value: {{ .Values.llava.yoloTriggerIntervalS | quote }}
            - name: LLAVA_MAX_TOKENS
              value: {{ .Values.llava.maxNewTokens | quote }}
            - name: LLAVA_LOAD_4BIT
              value: {{ .Values.llava.load4bit | quote }}
            - name: LLAVA_START_DELAY
              value: {{ .Values.llava.startDelaySeconds | quote }}
            - name: LLAVA_TRIGGER_TOPIC
              value: {{ .Values.topics.llavaTrigger | quote }}
            - name: LLAVA_RESPONSE_TOPIC
              value: {{ .Values.topics.llavaResponse | quote }}
            - name: LLAVA_LATENCY_TOPIC
              value: {{ .Values.topics.llavaLatency | quote }}
            - name: LLAVA_INFERENCE_TOPIC
              value: {{ .Values.topics.llavaInference | quote }}
            # Voxtral voice interaction
            - name: VOXTRAL_ENABLED
              value: {{ .Values.voxtral.enabled | quote }}
            - name: VOXTRAL_AUDIO_MODE
              value: {{ .Values.voxtral.audioMode | quote }}
            - name: VOXTRAL_MODEL_ID
              value: {{ .Values.voxtral.modelId | quote }}
            - name: VOICE_COMMAND_TOPIC
              value: {{ .Values.topics.voiceCommand | quote }}
            - name: VOICE_TRANSCRIPT_TOPIC
              value: {{ .Values.topics.voiceTranscript | quote }}
            - name: VOICE_RESPONSE_TOPIC
              value: {{ .Values.topics.voiceResponse | quote }}
            - name: VOICE_LATENCY_TOPIC
              value: {{ .Values.topics.voiceLatency | quote }}
            {{- if .Values.cyclonedds.enabled }}
            - name: CYCLONEDDS_URI
              value: "file:///etc/cyclonedds/cyclonedds.xml"
            {{- end }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              source /opt/ros/humble/setup.bash
              source /opt/base_ws/install/setup.bash
              source /opt/overlay_ws/install/setup.bash

              echo "[overlay] Starting camera node from base workspace..."
              ros2 run camera_driver_pkg camera_driver --ros-args \
                -p device:=${CAMERA_DEVICE} \
                -p width:=${CAMERA_WIDTH} \
                -p height:=${CAMERA_HEIGHT} \
                -p fps:=${CAMERA_FPS} \
                -p frame_id:=${CAMERA_FRAME_ID} \
                -p synthetic_mode:=${CAMERA_SYNTHETIC_MODE} \
                -p image_topic:=${IMAGE_TOPIC} &
              CAMERA_PID=$!

              sleep ${YOLO_START_DELAY}
              echo "[overlay] Starting yolo node from overlay workspace..."
              ros2 run yolo_detector_pkg yolo_detector --ros-args \
                -p model_path:=${YOLO_MODEL_PATH} \
                -p conf:=${YOLO_CONF} \
                -p image_topic:=${IMAGE_TOPIC} \
                -p detections_topic:=${DETECTIONS_TOPIC} \
                -p debug_image_topic:=${DEBUG_IMAGE_TOPIC} \
                -p publish_debug_image:=${YOLO_PUBLISH_DEBUG} \
                -p publish_metrics:=${YOLO_PUBLISH_METRICS} \
                -p latency_topic:=${LATENCY_TOPIC} \
                -p inference_topic:=${INFERENCE_TOPIC} \
                -p filter_classes:="\"${YOLO_FILTER_CLASSES}\"" &
              YOLO_PID=$!

              python3 /opt/scripts/resource_monitor.py &
              MONITOR_PID=$!

              if [ "${LLAVA_ENABLED}" = "true" ]; then
                sleep ${LLAVA_START_DELAY}
                echo "[overlay] Starting LLaVA reasoning node..."
                ros2 run llava_pkg llava_node --ros-args \
                  -p model_id:=${LLAVA_MODEL_ID} \
                  -p image_topic:="${IMAGE_TOPIC}" \
                  -p detection_topic:="${DETECTIONS_TOPIC}" \
                  -p trigger_topic:="${LLAVA_TRIGGER_TOPIC}" \
                  -p response_topic:="${LLAVA_RESPONSE_TOPIC}" \
                  -p latency_topic:="${LLAVA_LATENCY_TOPIC}" \
                  -p inference_topic:="${LLAVA_INFERENCE_TOPIC}" \
                  -p trigger_on_yolo:=${LLAVA_TRIGGER_ON_YOLO} \
                  -p yolo_trigger_interval_s:=${LLAVA_YOLO_INTERVAL_S} \
                  -p max_new_tokens:=${LLAVA_MAX_TOKENS} \
                  -p load_in_4bit:=${LLAVA_LOAD_4BIT} &
                LLAVA_PID=$!
              fi

              if [ "${VOXTRAL_ENABLED}" = "true" ]; then
                echo "[overlay] Starting Voxtral interaction node..."
                ros2 run voxtral_pkg voxtral_node --ros-args \
                  -p audio_mode:=${VOXTRAL_AUDIO_MODE} \
                  -p model_id:="${VOXTRAL_MODEL_ID}" \
                  -p command_topic:="${VOICE_COMMAND_TOPIC}" \
                  -p transcript_topic:="${VOICE_TRANSCRIPT_TOPIC}" \
                  -p response_topic:="${VOICE_RESPONSE_TOPIC}" \
                  -p latency_topic:="${VOICE_LATENCY_TOPIC}" &
                VOXTRAL_PID=$!
              fi

              wait -n ${CAMERA_PID} ${YOLO_PID} ${MONITOR_PID}
              exit 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.cyclonedds.enabled (and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode)) }}
          volumeMounts:
            {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
            - name: video-device
              mountPath: /dev/video0
            {{- end }}
            {{- if .Values.cyclonedds.enabled }}
            - name: cyclonedds
              mountPath: /etc/cyclonedds
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  source /opt/ros/humble/setup.bash && ros2 node list | grep -q "/camera_driver" && ros2 node list | grep -q "/yolo_detector"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  source /opt/ros/humble/setup.bash && ros2 node list | grep -q "/camera_driver" && ros2 node list | grep -q "/yolo_detector"
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
      {{- if or .Values.cyclonedds.enabled (and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode)) }}
      volumes:
        {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
        - name: video-device
          hostPath:
            path: /dev/video0
            type: CharDevice
        {{- end }}
        {{- if .Values.cyclonedds.enabled }}
        - name: cyclonedds
          configMap:
            name: {{ include "ros2-overlay.fullname" . }}-cyclonedds
            items:
              - key: cyclonedds.xml
                path: cyclonedds.xml
        {{- end }}
      {{- end }}
