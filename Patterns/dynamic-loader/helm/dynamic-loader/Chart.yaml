apiVersion: v2
name: dynamic-loader
description: |
  Dynamic Module Loading pattern for ROS 2 robotics on Kubernetes.

  Realizes the ROS 2 dynamic composition theory:
    - A long-lived component_container_isolated process exposes
      LoadNode / UnloadNode services.
    - Plugins (camera, yolo, llava, voxtral) are registered via
      `rclpy_components` entry_points and loaded INTO the container's
      process on demand — true intra-process composition, not subprocess
      spawning.
    - A FastAPI orchestrator container (sibling in the same pod) calls
      those services via HTTP API, exposing /load, /unload, /list to
      the dashboard.

  This realisation uses true intra-process composition through
  rclpy_components and the standard ROS 2 LoadNode / UnloadNode service
  contract, instead of spawning a subprocess per loaded module.
type: application
version: 1.0.0
appVersion: humble
keywords:
  - ros2
  - dynamic-composition
  - rclpy-components
annotations:
  # Rancher Apps: extend default timeout (10m) to 30m. Required because
  # dynamic-loader pulls a 76 GB image, then bootstrap Job loads 4
  # ROS 2 components into the host process via /load HTTP calls.
  catalog.cattle.io/timeout: 30m
maintainers:
