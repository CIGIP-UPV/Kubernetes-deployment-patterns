questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: images.camera.tag
    label: "Camera Image Tag"
    description: "Docker image tag for the camera driver"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  - variable: images.dynamicHost.tag
    label: "Dynamic Host Image Tag"
    description: "Docker image tag for the dynamic loader host"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  # ── Node Placement ──────────────────────────────────────────────
  - variable: nodeHostname
    label: "Deploy on Node"
    description: "Hostname of the node where the dynamic loader pod runs"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS"
    description: "0 = unlimited (native camera rate). For benchmarks: S1=10, S2=20, S3=30"
    type: enum
    default: 0
    required: true
    options:
      - 0
      - 10
      - 20
      - 30
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.mountVideoDevice
    label: "Mount /dev/video0"
    description: "Mount the physical camera device into the container (required for real camera)"
    type: boolean
    default: true
    group: "Camera"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: false
    show_if: "camera.mountVideoDevice=false"
    group: "Camera"


  - variable: dynamic.autoLoadYolo
    label: "Auto-load YOLO on Startup"
    description: "Automatically load the YOLO module when the pod starts"
    type: boolean
    default: true
    group: "Dynamic Loading"

  - variable: dynamic.publishDebugImage
    label: "Publish Debug Image"
    description: "Publish annotated YOLO detection image (required for dashboard video feed)"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: dynamic.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: dynamic.filterClasses
    label: "Filter Detection Classes"
    description: "COCO class IDs to detect (empty = all 80 classes). Examples: '0' = person only, '0,16,17' = person+dog+cat"
    type: string
    default: ""
    group: "Experiment"

  # ── Benchmark Probe ──────────────────────────────────────────────
  - variable: benchmark.enabled
    label: "Run Benchmark Probe"
    description: "Launch a Job that collects latency, inference time and FPS metrics after deployment"
    type: boolean
    default: false
    group: "Benchmark"

  - variable: benchmark.durationSeconds
    label: "Probe Duration (seconds)"
    description: "How long the benchmark probe listens for ROS 2 metrics"
    type: enum
    default: 120
    show_if: "benchmark.enabled=true"
    options:
      - 60
      - 120
      - 180
      - 300
    group: "Benchmark"

  - variable: benchmark.initialWaitSeconds
    label: "Initial Wait (seconds)"
    description: "Seconds to wait for the main app to start before probing"
    type: enum
    default: 60
    show_if: "benchmark.enabled=true"
    options:
      - 30
      - 60
      - 90
      - 120
    group: "Benchmark"

  - variable: benchmark.httpPort
    label: "Results HTTP Port"
    description: "Port for the HTTP file server to download benchmark results (summary.json, latency.csv, inference.csv)"
    type: int
    default: 9999
    show_if: "benchmark.enabled=true"
    group: "Benchmark"

  - variable: dynamic.conf
    label: "YOLO Confidence Threshold"
    description: "Minimum confidence for object detection"
    type: enum
    default: 0.25
    options:
      - 0.10
      - 0.25
      - 0.50
      - 0.75
    group: "Experiment"

  # ── CycloneDDS Configuration ────────────────────────────
  - variable: cyclonedds.enabled
    label: "Enable CycloneDDS"
    description: "Enable unicast communication between edge and cloud nodes"
    type: boolean
    default: true
    group: "CycloneDDS"

  - variable: cyclonedds.allowMulticast
    label: "Allow Multicast"
    description: "Enable multicast discovery (set to 'false' for pure unicast)"
    type: enum
    default: "false"
    options:
      - "true"
      - "false"
    show_if: "cyclonedds.enabled=true"
    group: "CycloneDDS"

  # ── Dashboard Configuration ──────────────────────────────
  - variable: dashboard.enabled
    label: "Enable Dashboard"
    description: "Deploy a cloud-side ROS 2 observability dashboard"
    type: boolean
    default: true
    group: "Dashboard"

  - variable: dashboard.image.tag
    label: "Dashboard Image Tag"
    description: "Docker image tag for the ROS 2 dashboard"
    type: string
    default: "latest"
    required: true
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.nodeHostname
    label: "Dashboard Node Placement"
    description: "Hostname of the node where the dashboard runs (cloud side)"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.httpNodePort
    label: "Dashboard HTTP NodePort"
    description: "NodePort for web access (empty = auto-assign)"
    type: int
    default: 31406
    required: false
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.wsNodePort
    label: "Dashboard WebSocket NodePort"
    description: "NodePort for WebSocket (empty = auto-assign)"
    type: int
    default: 31407
    required: false
    show_if: "dashboard.enabled=true"
    group: "Dashboard"
