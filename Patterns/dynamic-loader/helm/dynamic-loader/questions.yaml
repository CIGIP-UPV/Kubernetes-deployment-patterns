questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: images.camera.tag
    label: "Camera Image Tag"
    description: "Docker image tag for the camera driver"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  - variable: images.dynamicHost.tag
    label: "Dynamic Host Image Tag"
    description: "Docker image tag for the dynamic loader host"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  # ── Node Placement ──────────────────────────────────────────────
  - variable: nodeHostname
    label: "Deploy on Node"
    description: "Hostname of the node where the dynamic loader pod runs"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS"
    description: "0 = unlimited (native camera rate). For benchmarks: S1=10, S2=20, S3=30"
    type: enum
    default: "0"
    required: true
    options:
      - "40"
      - "0"
      - "10"
      - "20"
      - "30"
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.device
    label: "Camera Device"
    description: "Path del dispositivo de cámara (e.g. /dev/video0, /dev/video1)"
    type: string
    default: "/dev/video0"
    group: "Camera"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: false
    group: "Camera"


  - variable: dynamic.autoLoadYolo
    label: "Auto-load YOLO on Startup"
    description: "Automatically load the YOLO module when the pod starts"
    type: boolean
    default: true
    group: "Dynamic Loading"

  - variable: dynamic.publishDebugImage
    label: "Publish Debug Image"
    description: "Publish annotated YOLO detection image (required for dashboard video feed)"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: dynamic.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: dynamic.filterClasses
    label: "Filter Detection Classes"
    description: "COCO class IDs to detect (empty = all 80 classes). Examples: '0' = person only, '0,16,17' = person+dog+cat"
    type: string
    default: ""
    group: "Experiment"

  # ── Benchmark Probe ──────────────────────────────────────────────
  - variable: benchmark.enabled
    label: "Run Benchmark Probe"
    description: "Launch a Job that collects latency, inference time and FPS metrics after deployment"
    type: boolean
    default: false
    group: "Benchmark"

  - variable: benchmark.durationSeconds
    label: "Probe Duration (seconds)"
    description: "How long the benchmark probe listens for ROS 2 metrics"
    type: enum
    default: 120
    show_if: "benchmark.enabled=true"
    options:
      - 60
      - 120
      - 180
      - 300
    group: "Benchmark"

  - variable: benchmark.initialWaitSeconds
    label: "Initial Wait (seconds)"
    description: "Seconds to wait for the main app to start before probing"
    type: enum
    default: 60
    show_if: "benchmark.enabled=true"
    options:
      - 30
      - 60
      - 90
      - 120
    group: "Benchmark"

  - variable: benchmark.httpPort
    label: "Results HTTP Port"
    description: "Port for the HTTP file server to download benchmark results (summary.json, latency.csv, inference.csv)"
    type: int
    default: 9999
    show_if: "benchmark.enabled=true"
    group: "Benchmark"

  - variable: dynamic.conf
    label: "YOLO Confidence Threshold"
    description: "Minimum confidence for object detection"
    type: enum
    default: 0.25
    options:
      - 0.10
      - 0.25
      - 0.50
      - 0.75
    group: "Experiment"

  # ── CycloneDDS Configuration ────────────────────────────
  - variable: cyclonedds.enabled
    label: "Enable CycloneDDS"
    description: "Enable unicast communication between edge and cloud nodes"
    type: boolean
    default: true
    group: "CycloneDDS"

  - variable: cyclonedds.allowMulticast
    label: "Allow Multicast"
    description: "Enable multicast discovery (set to 'false' for pure unicast)"
    type: enum
    default: "false"
    options:
      - "true"
      - "false"
    show_if: "cyclonedds.enabled=true"
    group: "CycloneDDS"

  # ── Dashboard Configuration ──────────────────────────────
  - variable: dashboard.enabled
    label: "Enable Dashboard"
    description: "Deploy a cloud-side ROS 2 observability dashboard"
    type: boolean
    default: true
    group: "Dashboard"

  - variable: dashboard.image.tag
    label: "Dashboard Image Tag"
    description: "Docker image tag for the ROS 2 dashboard"
    type: string
    default: "latest"
    required: true
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.nodeHostname
    label: "Dashboard Node Placement"
    description: "Hostname of the node where the dashboard runs (cloud side)"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.httpNodePort
    label: "Dashboard HTTP NodePort"
    description: "NodePort for web access (empty = auto-assign)"
    type: int
    default: 31406
    required: false
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.wsNodePort
    label: "Dashboard WebSocket NodePort"
    description: "NodePort for WebSocket (empty = auto-assign)"
    type: int
    default: 31407
    required: false
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  # ── LLaVA — Visual Reasoning ─────────────────────────────────────
  - variable: llava.enabled
    label: "Enable LLaVA"
    description: "Enable LLaVA-1.5-7b for visual scene understanding and reasoning (load manually via API)"
    type: boolean
    default: true
    group: "LLaVA — Razonamiento Visual"

  - variable: llava.autoLoad
    label: "Auto-load LLaVA on startup"
    description: "Automatically start LLaVA when the pod starts (requires GPU with enough VRAM)"
    type: boolean
    default: false
    show_if: "llava.enabled=true"
    group: "LLaVA — Razonamiento Visual"

  # ── Voxtral — Voice Interaction ──────────────────────────────────
  - variable: voxtral.enabled
    label: "Enable Voxtral"
    description: "Enable Voxtral-Mini-4B for human-robot voice interaction (load manually via API)"
    type: boolean
    default: true
    group: "Voxtral — Interacción por Voz"

  - variable: voxtral.audioMode
    label: "Audio Mode"
    description: "false = text simulation (send commands via /voice/command topic) | true = microphone capture (requires USB mic mounted)"
    type: boolean
    default: false
    show_if: "voxtral.enabled=true"
    group: "Voxtral — Interacción por Voz"

  - variable: voxtral.autoLoad
    label: "Auto-load Voxtral on startup"
    description: "Automatically start Voxtral when the pod starts (requires GPU with enough VRAM)"
    type: boolean
    default: false
    show_if: "voxtral.enabled=true"
    group: "Voxtral — Interacción por Voz"

  # ── GPU Configuration ────────────────────────────────────────────
  - variable: gpu.enabled
    label: "Enable GPU"
    description: "Expose NVIDIA GPU to model containers (Jetson AGX Orin). Sets NVIDIA_VISIBLE_DEVICES and NVIDIA_DRIVER_CAPABILITIES env vars."
    type: boolean
    default: true
    group: "GPU"

  - variable: gpu.runtimeClassName
    label: "Runtime Class"
    description: "Kubernetes runtimeClassName for NVIDIA container runtime. Leave 'nvidia' for standard Jetson/K3s setups."
    type: string
    default: "nvidia"
    show_if: "gpu.enabled=true"
    group: "GPU"

  - variable: gpu.requestGpuResource
    label: "Request nvidia.com/gpu Resource"
    description: "Request nvidia.com/gpu in pod resource limits. Enable for single-pod patterns; disable if multiple pods share one GPU."
    type: boolean
    default: true
    show_if: "gpu.enabled=true"
    group: "GPU"
