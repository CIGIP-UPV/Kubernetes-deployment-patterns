questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: images.camera.tag
    label: "Camera Image Tag"
    description: "Docker image tag for the camera driver"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  - variable: images.dynamicHost.tag
    label: "Dynamic Host Image Tag"
    description: "Docker image tag for the dynamic loader host"
    type: string
    default: "latest"
    required: true
    group: "Container Images"

  # ── Node Placement ──────────────────────────────────────────────
  - variable: nodeHostname
    label: "Deploy on Node"
    description: "Hostname of the node where the dynamic loader pod runs"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
      - "edgenode01"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS"
    description: "0 = unlimited (native camera rate). For benchmarks: S1=10, S2=20, S3=30"
    type: enum
    default: "0"
    required: true
    options:
      - "0"
      - "10"
      - "20"
      - "30"
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.device
    label: "Camera Device"
    description: "Path del dispositivo de cámara (e.g. /dev/video0, /dev/video1)"
    type: string
    default: "/dev/video1"
    group: "Camera"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: false
    group: "Camera"


  - variable: dynamic.autoLoadYolo
    label: "Auto-load YOLO on Startup"
    description: "Automatically load the YOLO module when the pod starts"
    type: boolean
    default: true
    group: "Dynamic Loading"

  - variable: dynamic.publishDebugImage
    label: "Publish Debug Image"
    description: "Publish annotated YOLO detection image (required for dashboard video feed)"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: dynamic.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: dynamic.filterClasses
    label: "Filter Detection Classes"
    description: "COCO class IDs to detect (empty = all 80 classes). Examples: '0' = person only, '0,56,60' = person+screen+chair"
    type: string
    default: "0,56,60"
    group: "Experiment"

  # ── CycloneDDS Configuration ────────────────────────────
  - variable: cyclonedds.enabled
    label: "Enable CycloneDDS"
    description: "Enable unicast communication between edge and cloud nodes"
    type: boolean
    default: true
    group: "CycloneDDS"

  - variable: cyclonedds.allowMulticast
    label: "Allow Multicast"
    description: "Enable multicast discovery (set to 'false' for pure unicast)"
    type: enum
    default: "false"
    options:
      - "true"
      - "false"
    show_if: "cyclonedds.enabled=true"
    group: "CycloneDDS"

  # ── Dashboard Configuration ──────────────────────────────
  - variable: dashboard.enabled
    label: "Enable Dashboard"
    description: "Deploy a cloud-side ROS 2 observability dashboard"
    type: boolean
    default: true
    group: "Dashboard"

  - variable: dashboard.image.tag
    label: "Dashboard Image Tag"
    description: "Docker image tag for the ROS 2 dashboard"
    type: string
    default: "latest"
    required: true
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.nodeHostname
    label: "Dashboard Node Placement"
    description: "Hostname of the node where the dashboard runs (cloud side)"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.httpNodePort
    label: "Dashboard HTTP NodePort"
    description: "NodePort for web access (empty = auto-assign)"
    type: int
    default: 31406
    required: false
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  - variable: dashboard.service.wsNodePort
    label: "Dashboard WebSocket NodePort"
    description: "NodePort for WebSocket (empty = auto-assign)"
    type: int
    default: 31407
    required: false
    show_if: "dashboard.enabled=true"
    group: "Dashboard"

  # ── LLaVA — Visual Reasoning ─────────────────────────────────────
  - variable: llava.enabled
    label: "Enable LLaVA"
    description: "Enable LLaVA-1.5-7b for visual scene understanding and reasoning (load manually via API)"
    type: boolean
    default: true
    group: "LLaVA — Razonamiento Visual"

  - variable: llava.autoLoad
    label: "Auto-load LLaVA on startup"
    description: "Automatically start LLaVA when the pod starts (requires GPU with enough VRAM)"
    type: boolean
    default: false
    show_if: "llava.enabled=true"
    group: "LLaVA — Razonamiento Visual"

  # ── Voxtral — Voice Interaction ──────────────────────────────────
  - variable: voxtral.enabled
    label: "Enable Voxtral"
    description: "Enable Voxtral-Mini-3B for human-robot voice interaction (load manually via API)"
    type: boolean
    default: true
    group: "Voxtral — Interacción por Voz"

  - variable: voxtral.audioMode
    label: "Audio Mode"
    description: "false = text simulation (send commands via /voice/command topic) | true = microphone capture (requires USB mic mounted)"
    type: boolean
    default: false
    show_if: "voxtral.enabled=true"
    group: "Voxtral — Interacción por Voz"

  - variable: voxtral.autoLoad
    label: "Auto-load Voxtral on startup"
    description: "Automatically start Voxtral when the pod starts (requires GPU with enough VRAM)"
    type: boolean
    default: false
    show_if: "voxtral.enabled=true"
    group: "Voxtral — Interacción por Voz"
