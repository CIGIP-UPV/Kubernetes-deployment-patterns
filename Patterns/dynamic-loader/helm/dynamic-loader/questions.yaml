questions:
  # ── Docker Registry ──────────────────────────────────────────────
  - variable: imagePullSecretName
    label: "Image Pull Secret"
    description: "Name of the Kubernetes secret for pulling images from GHCR"
    type: string
    default: "regcred"
    required: false
    group: "Container Images"

  - variable: images.camera.tag
    label: "Camera Image Tag"
    description: "Docker image tag for the camera driver"
    type: string
    default: "v1"
    required: true
    group: "Container Images"

  - variable: images.dynamicHost.tag
    label: "Dynamic Host Image Tag"
    description: "Docker image tag for the dynamic loader host"
    type: string
    default: "v1"
    required: true
    group: "Container Images"

  # ── Node Placement ──────────────────────────────────────────────
  - variable: nodeHostname
    label: "Deploy on Node"
    description: "Hostname of the node where the dynamic loader pod runs"
    type: enum
    default: ""
    required: false
    options:
      - ""
      - "kb2"
      - "worker1-kb2"
    group: "Node Placement"

  # ── Experiment Scenario ──────────────────────────────────────────
  - variable: camera.fps
    label: "Camera FPS (Scenario)"
    description: "Frame rate: S1=10 Hz, S2=20 Hz, S3=30 Hz"
    type: enum
    default: 10
    required: true
    options:
      - 10
      - 20
      - 30
    group: "Experiment"

  - variable: ros.domainId
    label: "ROS Domain ID"
    description: "Isolates ROS 2 communication between experiments"
    type: enum
    default: "42"
    required: true
    options:
      - "42"
      - "1"
      - "2"
      - "3"
    group: "Experiment"

  - variable: camera.syntheticMode
    label: "Camera Source"
    description: "true = Synthetic test frames (no hardware) | false = Real camera on edge node"
    type: boolean
    default: true
    group: "Camera"

  - variable: camera.mountVideoDevice
    label: "Mount /dev/video0"
    description: "Mount the physical camera device into the camera container (required for real camera)"
    type: boolean
    default: false
    show_if: "camera.syntheticMode=false"
    group: "Camera"

  - variable: dynamic.autoLoadYolo
    label: "Auto-load YOLO on Startup"
    description: "Automatically load the YOLO module when the pod starts"
    type: boolean
    default: true
    group: "Dynamic Loading"

  - variable: dynamic.publishMetrics
    label: "Publish Benchmark Metrics"
    description: "Enable latency and inference time metrics on ROS topics"
    type: enum
    default: "true"
    options:
      - "true"
      - "false"
    group: "Experiment"

  - variable: dynamic.conf
    label: "YOLO Confidence Threshold"
    description: "Minimum confidence for object detection"
    type: enum
    default: 0.25
    options:
      - 0.10
      - 0.25
      - 0.50
      - 0.75
    group: "Experiment"
