replicaCount: 1

images:
  camera:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-camera
    tag: v1
    pullPolicy: IfNotPresent
  dynamicHost:
    repository: ghcr.io/cigip-upv/kubernetes-deployment-patterns/ros2-yolo
    tag: v1
    pullPolicy: IfNotPresent

imagePullSecretName: regcred

ros:
  domainId: "42"
  rmwImplementation: rmw_cyclonedds_cpp
  localhostOnly: "0"

network:
  hostNetwork: true

nodeHostname: ""
nodeSelector: {}
affinity: {}
tolerations: []

camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 10
  frameId: camera
  syntheticMode: true
  mountVideoDevice: false

dynamic:
  apiPort: 5000
  autoLoadYolo: true
  modelPath: /opt/models/yolov8n.pt
  conf: 0.25
  publishDebugImage: "false"
  publishMetrics: "true"
  allowedModules:
    - yolo_detector

topics:
  image: /camera/image_raw
  detections: /detections
  debugImage: /detections/image
  latency: /benchmark/latency_ms
  inference: /benchmark/inference_ms

resources:
  camera: {}
  dynamicHost: {}

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

benchmark:
  enabled: false
  durationSeconds: 120
  initialWaitSeconds: 60
  httpPort: 9999
  ttlSecondsAfterFinished: 3600

nameOverride: ""
fullnameOverride: ""
