{{- if .Values.benchmark.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dynamic-loader.fullname" . }}-benchmark-{{ now | date "150405" }}
  labels:
    {{- include "dynamic-loader.labels" . | nindent 4 }}
    component: benchmark
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: {{ .Values.benchmark.ttlSecondsAfterFinished | default 3600 }}
  template:
    metadata:
      labels:
        {{- include "dynamic-loader.labels" . | nindent 8 }}
        component: benchmark
    spec:
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      {{- if .Values.nodeHostname }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeHostname }}
      {{- end }}
      initContainers:
        - name: wait-for-app
          image: "{{ .Values.images.dynamicHost.repository }}:{{ .Values.images.dynamicHost.tag }}"
          imagePullPolicy: {{ .Values.images.dynamicHost.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "[benchmark] Waiting {{ .Values.benchmark.initialWaitSeconds }}s for app to start..."
              sleep {{ .Values.benchmark.initialWaitSeconds }}
              echo "[benchmark] Wait complete, starting probe."
      containers:
        - name: probe
          image: "{{ .Values.images.dynamicHost.repository }}:{{ .Values.images.dynamicHost.tag }}"
          imagePullPolicy: {{ .Values.images.dynamicHost.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              source /opt/ros/humble/setup.bash
              export ROS_DOMAIN_ID={{ .Values.ros.domainId }}
              export RMW_IMPLEMENTATION={{ .Values.ros.rmwImplementation }}
              export ROS_LOCALHOST_ONLY=0

              echo "[benchmark] Starting probe for {{ .Values.benchmark.durationSeconds }}s..."
              echo "[benchmark] Pattern: dynamic-loader"
              echo "[benchmark] Release: {{ .Release.Name }}"
              echo "[benchmark] ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}"
              echo "[benchmark] Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

              # Start resource sampler in background
              python3 /probe/resource_sampler.py \
                --interval 2 \
                --output /tmp/resources.csv \
                --duration {{ add (int .Values.benchmark.durationSeconds) 30 }} &
              RESOURCE_PID=$!
              echo "[benchmark] Resource sampler started (PID $RESOURCE_PID)"

              python3 /probe/ros_latency_probe.py \
                --latency-topic {{ .Values.topics.latency }} \
                --inference-topic {{ .Values.topics.inference }} \
                --duration {{ .Values.benchmark.durationSeconds }} \
                --output-dir /tmp \
                --summary /tmp/summary.json

              # Stop resource sampler
              kill $RESOURCE_PID 2>/dev/null && wait $RESOURCE_PID 2>/dev/null || true

              echo ""
              echo "[benchmark] Probe finished. Results saved to /tmp/"
              echo "[benchmark] Files: summary.json, latency.csv, inference.csv, resources.csv"
              echo ""
              NODE_IP=$(hostname -I | awk '{print $1}')
              PORT={{ .Values.benchmark.httpPort | default 9999 }}
              echo "============================================================"
              echo "  DOWNLOAD RESULTS via HTTP:"
              echo "    http://${NODE_IP}:${PORT}/summary.json"
              echo "    http://${NODE_IP}:${PORT}/latency.csv"
              echo "    http://${NODE_IP}:${PORT}/inference.csv"
              echo "    http://${NODE_IP}:${PORT}/resources.csv"
              echo ""
              echo "  Or browse all files at:"
              echo "    http://${NODE_IP}:${PORT}/"
              echo "============================================================"
              echo ""
              echo "[benchmark] Starting HTTP server on port ${PORT} for file download..."
              cd /tmp && python3 -m http.server ${PORT} &
              HTTP_PID=$!
              echo "[benchmark] HTTP server running (PID $HTTP_PID). Keeping alive for 10 minutes..."
              sleep 600
              kill $HTTP_PID 2>/dev/null || true
          volumeMounts:
            - name: probe-script
              mountPath: /probe
              readOnly: true
      volumes:
        - name: probe-script
          configMap:
            name: {{ include "dynamic-loader.fullname" . }}-benchmark
{{- end }}
