{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dynamic-loader.fullname" . }}-dashboard-html
  labels:
    {{- include "dynamic-loader.labels" . | nindent 4 }}
    component: dashboard
data:
  index.html: |
{{ .Files.Get "files/dashboard.html" | replace "__PATTERN__" (.Values.dashboard.pattern | default "dynamic-loader") | indent 4 }}
{{- end }}
