apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dynamic-loader.fullname" . }}
  labels:
    {{- include "dynamic-loader.labels" . | nindent 4 }}
    pattern: dynamic-loader
spec:
  serviceName: {{ include "dynamic-loader.fullname" . }}-peers
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dynamic-loader.name" . }}
      pattern: dynamic-loader
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "dynamic-loader.name" . }}
        pattern: dynamic-loader
        {{- include "dynamic-loader.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      {{- if .Values.nodeHostname }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeHostname }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      # ── Wait for the dashboard DNS before starting. CycloneDDS resolves
      # unicast peers ONCE at startup; without this, the dynamic-loader
      # pod can win the startup race and the dashboard ends up flagged
      # "unknown address" forever in DDS.
      {{- if .Values.dashboard.enabled }}
      initContainers:
        - name: wait-for-peers
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              FULLNAME="{{ include "dynamic-loader.fullname" . }}"
              NS="{{ .Release.Namespace }}"
              PEER="${FULLNAME}-dashboard-0.${FULLNAME}-dashboard-peers.${NS}.svc.cluster.local"
              echo "[init] Waiting for DDS peer DNS: $PEER"
              until nslookup "$PEER" >/dev/null 2>&1; do
                echo "[init]   $PEER not resolvable yet, retrying in 3s..."
                sleep 3
              done
              echo "[init] $PEER resolved — starting dynamic loader"
      {{- end }}
      containers:
        - name: camera
          image: "{{ .Values.images.camera.repository }}:{{ .Values.images.camera.tag }}"
          imagePullPolicy: {{ .Values.images.camera.pullPolicy }}
          {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
          securityContext:
            privileged: true
          {{- end }}
          env:
            - name: ROS_DOMAIN_ID
              value: {{ .Values.ros.domainId | quote }}
            - name: RMW_IMPLEMENTATION
              value: {{ .Values.ros.rmwImplementation | quote }}
            - name: ROS_LOCALHOST_ONLY
              value: "0"
            {{- if .Values.cyclonedds.enabled }}
            - name: CYCLONEDDS_URI
              value: "file:///etc/cyclonedds/cyclonedds.xml"
            {{- end }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              source /opt/ros/humble/setup.bash
              if [ -f /opt/ros2_cam_ws/install/setup.bash ]; then
                source /opt/ros2_cam_ws/install/setup.bash
              fi
              ros2 run camera_driver_pkg camera_driver --ros-args \
                -p device:={{ .Values.camera.device | quote }} \
                -p width:={{ .Values.camera.width }} \
                -p height:={{ .Values.camera.height }} \
                -p fps:={{ .Values.camera.fps }} \
                -p frame_id:={{ .Values.camera.frameId | quote }} \
                -p synthetic_mode:={{ .Values.camera.syntheticMode | quote }} \
                -p image_topic:={{ .Values.topics.image | quote }}
          resources:
            {{- toYaml .Values.resources.camera | nindent 12 }}
          {{- if or .Values.cyclonedds.enabled (and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode)) }}
          volumeMounts:
            {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
            - name: video-device
              mountPath: {{ .Values.camera.device }}
            {{- end }}
            {{- if .Values.cyclonedds.enabled }}
            - name: cyclonedds
              mountPath: /etc/cyclonedds
              readOnly: true
            {{- end }}
          {{- end }}
        - name: dynamic-host
          image: "{{ .Values.images.dynamicHost.repository }}:{{ .Values.images.dynamicHost.tag }}"
          imagePullPolicy: {{ .Values.images.dynamicHost.pullPolicy }}
          workingDir: /app
          env:
            - name: ROS_DOMAIN_ID
              value: {{ .Values.ros.domainId | quote }}
            - name: RMW_IMPLEMENTATION
              value: {{ .Values.ros.rmwImplementation | quote }}
            - name: ROS_LOCALHOST_ONLY
              value: "0"
            {{- if .Values.cyclonedds.enabled }}
            - name: CYCLONEDDS_URI
              value: "file:///etc/cyclonedds/cyclonedds.xml"
            {{- end }}
            - name: PORT
              value: {{ .Values.dynamic.apiPort | quote }}
            - name: AUTO_LOAD_YOLO
              value: {{ .Values.dynamic.autoLoadYolo | quote }}
            - name: ALLOWED_MODULES
              value: {{ .Values.dynamic.allowedModules | join "," | quote }}
            - name: YOLO_MODEL_PATH
              value: {{ .Values.dynamic.modelPath | quote }}
            - name: YOLO_CONF
              value: {{ .Values.dynamic.conf | quote }}
            - name: YOLO_PUBLISH_DEBUG
              value: {{ .Values.dynamic.publishDebugImage | quote }}
            - name: YOLO_PUBLISH_METRICS
              value: {{ .Values.dynamic.publishMetrics | quote }}
            - name: YOLO_FILTER_CLASSES
              value: {{ .Values.dynamic.filterClasses | toString | quote }}
            - name: IMAGE_TOPIC
              value: {{ .Values.topics.image | quote }}
            - name: DETECTIONS_TOPIC
              value: {{ .Values.topics.detections | quote }}
            - name: DEBUG_IMAGE_TOPIC
              value: {{ .Values.topics.debugImage | quote }}
            - name: LATENCY_TOPIC
              value: {{ .Values.topics.latency | quote }}
            - name: INFERENCE_TOPIC
              value: {{ .Values.topics.inference | quote }}
            # LLaVA
            - name: LLAVA_ENABLED
              value: {{ .Values.llava.enabled | quote }}
            - name: LLAVA_MODEL_ID
              value: {{ .Values.llava.modelId | quote }}
            - name: LLAVA_AUTO_LOAD
              value: {{ .Values.llava.autoLoad | quote }}
            - name: LLAVA_RESPONSE_TOPIC
              value: {{ .Values.topics.llavaResponse | quote }}
            - name: LLAVA_LATENCY_TOPIC
              value: {{ .Values.topics.llavaLatency | quote }}
            - name: LLAVA_INFERENCE_TOPIC
              value: {{ .Values.topics.llavaInference | quote }}
            # Voxtral
            - name: VOXTRAL_ENABLED
              value: {{ .Values.voxtral.enabled | quote }}
            - name: VOXTRAL_AUDIO_MODE
              value: {{ .Values.voxtral.audioMode | quote }}
            - name: VOXTRAL_MODEL_ID
              value: {{ .Values.voxtral.modelId | quote }}
            - name: VOXTRAL_AUTO_LOAD
              value: {{ .Values.voxtral.autoLoad | quote }}
            - name: VOICE_COMMAND_TOPIC
              value: {{ .Values.topics.voiceCommand | quote }}
            - name: VOICE_TRANSCRIPT_TOPIC
              value: {{ .Values.topics.voiceTranscript | quote }}
            - name: VOICE_RESPONSE_TOPIC
              value: {{ .Values.topics.voiceResponse | quote }}
            - name: VOICE_LATENCY_TOPIC
              value: {{ .Values.topics.voiceLatency | quote }}
            {{- if .Values.gpu.enabled }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: {{ .Values.gpu.visibleDevices | default "all" | quote }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: {{ .Values.gpu.driverCapabilities | default "compute,utility" | quote }}
            {{- end }}
            {{- if .Values.hfCache.enabled }}
            - name: HF_HOME
              value: {{ .Values.hfCache.mountPath | quote }}
            - name: TRANSFORMERS_CACHE
              value: {{ .Values.hfCache.mountPath | quote }}
            - name: HF_HUB_CACHE
              value: {{ .Values.hfCache.mountPath | quote }}
            {{- end }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              source /opt/ros/humble/setup.bash
              if [ -f /opt/ros2_monolithic_ws/install/setup.bash ]; then
                source /opt/ros2_monolithic_ws/install/setup.bash
              elif [ -f /opt/ros_ws/install/setup.bash ]; then
                source /opt/ros_ws/install/setup.bash
              fi
              pip install --no-cache-dir fastapi uvicorn 2>/dev/null || true
              python3 /opt/scripts/resource_monitor.py &
              MONITOR_PID=$!
              python3 -m uvicorn server:app --host 0.0.0.0 --port ${PORT} &
              API_PID=$!
              wait -n ${MONITOR_PID} ${API_PID}
              exit 1
          ports:
            - name: http-api
              containerPort: {{ .Values.dynamic.apiPort }}
              protocol: TCP
          resources:
            {{- if and .Values.gpu.enabled .Values.gpu.requestGpuResource }}
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count | default 1 }}
            {{- end }}
            {{- with .Values.resources.dynamicHost }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: app-code
              mountPath: /app
            {{- if .Values.cyclonedds.enabled }}
            - name: cyclonedds
              mountPath: /etc/cyclonedds
              readOnly: true
            {{- end }}
            {{- if .Values.gpu.enabled }}
            - name: sys-devices-platform
              mountPath: /sys/devices/platform
              readOnly: true
            {{- end }}
            {{- if .Values.hfCache.enabled }}
            - name: hf-cache
              mountPath: {{ .Values.hfCache.mountPath }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: app-code
          configMap:
            name: {{ include "dynamic-loader.fullname" . }}-code
        {{- if and .Values.camera.mountVideoDevice (not .Values.camera.syntheticMode) }}
        - name: video-device
          hostPath:
            path: {{ .Values.camera.device }}
            type: CharDevice
        {{- end }}
        {{- if .Values.cyclonedds.enabled }}
        - name: cyclonedds
          configMap:
            name: {{ include "dynamic-loader.fullname" . }}-cyclonedds
            items:
              - key: cyclonedds.xml
                path: cyclonedds.xml
        {{- end }}
        {{- if .Values.gpu.enabled }}
        - name: sys-devices-platform
          hostPath:
            path: /sys/devices/platform
            type: Directory
        {{- end }}
        {{- if .Values.hfCache.enabled }}
        - name: hf-cache
          hostPath:
            path: {{ .Values.hfCache.hostPath }}
            type: {{ .Values.hfCache.type | default "DirectoryOrCreate" }}
        {{- end }}
