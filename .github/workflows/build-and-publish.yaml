# =============================================================================
# CI/CD Pipeline: Build Docker images + Publish Helm charts
# =============================================================================
# Smart triggers:
#   - Per-image change detection: only rebuilds images whose sources changed
#   - Each image builds in its own parallel job for speed
#   - Only publishes charts if Patterns/ changed
#   - Manual dispatch always available with full control
# =============================================================================

name: Build Images & Publish Charts

on:
  push:
    branches: [main]
    paths:
      - 'Models/**'
      - 'Patterns/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish_charts:
        description: 'Publish Helm charts to gh-pages'
        required: false
        type: boolean
        default: true
      publish_images:
        description: 'Build and push Docker images'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  REGISTRY_PREFIX: ghcr.io/cigip-upv/kubernetes-deployment-patterns
  TORCH_VARIANT: cpu
  BUILD_PLATFORM: linux/amd64,linux/arm64

jobs:
  # =========================================================================
  # Job 0: Detect what changed — per-image granularity
  # =========================================================================
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      camera_changed:     ${{ steps.changes.outputs.camera }}
      yolo_changed:       ${{ steps.changes.outputs.yolo }}
      llava_changed:      ${{ steps.changes.outputs.llava }}
      voxtral_changed:    ${{ steps.changes.outputs.voxtral }}
      monolithic_changed: ${{ steps.changes.outputs.monolithic }}
      overlay_changed:    ${{ steps.changes.outputs.overlay }}
      dashboard_changed:  ${{ steps.changes.outputs.dashboard }}
      charts_changed:     ${{ steps.changes.outputs.charts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths per image
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # --- Camera ---
          if echo "$CHANGED" | grep -qE '^Models/ros2_cam_ws/'; then
            echo "camera=true" >> $GITHUB_OUTPUT
            echo ">> ros2-camera needs rebuilding"
          else
            echo "camera=false" >> $GITHUB_OUTPUT
          fi

          # --- YOLO ---
          if echo "$CHANGED" | grep -qE '^Models/ros2_yolo_ws/'; then
            echo "yolo=true" >> $GITHUB_OUTPUT
            echo ">> ros2-yolo needs rebuilding"
          else
            echo "yolo=false" >> $GITHUB_OUTPUT
          fi

          # --- LLaVA ---
          if echo "$CHANGED" | grep -qE '^Models/ros2_llava_ws/'; then
            echo "llava=true" >> $GITHUB_OUTPUT
            echo ">> ros2-llava needs rebuilding"
          else
            echo "llava=false" >> $GITHUB_OUTPUT
          fi

          # --- Voxtral ---
          if echo "$CHANGED" | grep -qE '^Models/ros2_voxtral_ws/'; then
            echo "voxtral=true" >> $GITHUB_OUTPUT
            echo ">> ros2-voxtral needs rebuilding"
          else
            echo "voxtral=false" >> $GITHUB_OUTPUT
          fi

          # --- Monolithic (depends on cam + yolo + llava + voxtral + own sources) ---
          if echo "$CHANGED" | grep -qE '^Models/(ros2_monolithic_ws|ros2_cam_ws|ros2_yolo_ws|ros2_llava_ws|ros2_voxtral_ws)/'; then
            echo "monolithic=true" >> $GITHUB_OUTPUT
            echo ">> ros2-monolithic needs rebuilding"
          else
            echo "monolithic=false" >> $GITHUB_OUTPUT
          fi

          # --- Overlay (depends on cam + yolo + llava + voxtral + own sources) ---
          if echo "$CHANGED" | grep -qE '^Models/(ros2_overlay_ws|ros2_cam_ws|ros2_yolo_ws|ros2_llava_ws|ros2_voxtral_ws)/'; then
            echo "overlay=true" >> $GITHUB_OUTPUT
            echo ">> ros2-overlay needs rebuilding"
          else
            echo "overlay=false" >> $GITHUB_OUTPUT
          fi

          # --- Dashboard ---
          if echo "$CHANGED" | grep -qE '^Models/ros2_dashboard/'; then
            echo "dashboard=true" >> $GITHUB_OUTPUT
            echo ">> ros2-dashboard needs rebuilding"
          else
            echo "dashboard=false" >> $GITHUB_OUTPUT
          fi

          # --- Helm charts ---
          if echo "$CHANGED" | grep -qE '^Patterns/'; then
            echo "charts=true" >> $GITHUB_OUTPUT
            echo ">> Charts need republishing"
          else
            echo "charts=false" >> $GITHUB_OUTPUT
          fi

  # =========================================================================
  # Job 1a: Build ros2-camera
  # =========================================================================
  build-camera:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.camera_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ros2-camera
        uses: docker/build-push-action@v6
        with:
          context: Models/ros2_cam_ws
          file: Models/ros2_cam_ws/docker/Dockerfile
          platforms: ${{ env.BUILD_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/ros2-camera:latest
          build-args: |
            TORCH_VARIANT=${{ env.TORCH_VARIANT }}
          provenance: false
          cache-from: type=gha,scope=ros2-camera
          cache-to: type=gha,mode=max,scope=ros2-camera

  # =========================================================================
  # Job 1b: Build ros2-yolo
  # =========================================================================
  build-yolo:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.yolo_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ros2-yolo
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Models/ros2_yolo_ws/docker/Dockerfile
          platforms: ${{ env.BUILD_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/ros2-yolo:latest
          build-args: |
            TORCH_VARIANT=${{ env.TORCH_VARIANT }}
          provenance: false
          cache-from: type=gha,scope=ros2-yolo
          cache-to: type=gha,mode=max,scope=ros2-yolo

  # =========================================================================
  # Job 1c: Build ros2-llava
  # =========================================================================
  build-llava:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.llava_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ros2-llava
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Models/ros2_llava_ws/docker/Dockerfile
          platforms: ${{ env.BUILD_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/ros2-llava:latest
          build-args: |
            TORCH_VARIANT=${{ env.TORCH_VARIANT }}
          provenance: false
          cache-from: type=gha,scope=ros2-llava
          cache-to: type=gha,mode=max,scope=ros2-llava

  # =========================================================================
  # Job 1d: Build ros2-voxtral
  # =========================================================================
  build-voxtral:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.voxtral_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ros2-voxtral
        uses: docker/build-push-action@v6
        with:
          context: Models/ros2_voxtral_ws
          file: Models/ros2_voxtral_ws/docker/Dockerfile
          platforms: ${{ env.BUILD_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/ros2-voxtral:latest
          build-args: |
            TORCH_VARIANT=${{ env.TORCH_VARIANT }}
          provenance: false
          cache-from: type=gha,scope=ros2-voxtral
          cache-to: type=gha,mode=max,scope=ros2-voxtral

  # =========================================================================
  # Job 1f: Build ros2-monolithic
  # =========================================================================
  build-monolithic:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.monolithic_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ros2-monolithic
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Models/ros2_monolithic_ws/docker/Dockerfile
          platforms: ${{ env.BUILD_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/ros2-monolithic:latest
          build-args: |
            TORCH_VARIANT=${{ env.TORCH_VARIANT }}
          provenance: false
          cache-from: type=gha,scope=ros2-monolithic
          cache-to: type=gha,mode=max,scope=ros2-monolithic

  # =========================================================================
  # Job 1g: Build ros2-overlay
  # =========================================================================
  build-overlay:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.overlay_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ros2-overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Models/ros2_overlay_ws/docker/Dockerfile
          platforms: ${{ env.BUILD_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/ros2-overlay:latest
          build-args: |
            TORCH_VARIANT=${{ env.TORCH_VARIANT }}
          provenance: false
          cache-from: type=gha,scope=ros2-overlay
          cache-to: type=gha,mode=max,scope=ros2-overlay

  # =========================================================================
  # Job 1h: Build ros2-dashboard
  # =========================================================================
  build-dashboard:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.dashboard_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ros2-dashboard
        uses: docker/build-push-action@v6
        with:
          context: Models/ros2_dashboard/docker
          file: Models/ros2_dashboard/docker/Dockerfile
          platforms: ${{ env.BUILD_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/ros2-dashboard:latest
          provenance: false
          cache-from: type=gha,scope=ros2-dashboard
          cache-to: type=gha,mode=max,scope=ros2-dashboard

  # =========================================================================
  # Job 2: Publish Helm charts to GitHub Pages (gh-pages branch)
  # =========================================================================
  publish-charts:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-camera, build-yolo, build-llava, build-voxtral, build-monolithic, build-overlay, build-dashboard]

    if: |
      always() && !failure() && !cancelled() &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.charts_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_charts == 'true')
      )
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.4'

      - name: Lint charts
        run: |
          helm lint Patterns/monolithic/helm
          helm lint Patterns/microservices/helm/ros2-microservices
          helm lint Patterns/dynamic-loader/helm/dynamic-loader
          helm lint Patterns/overlay-workspaces/helm/ros2-overlay

      - name: Package charts
        run: |
          mkdir -p dist/charts
          helm package Patterns/monolithic/helm -d dist/charts
          helm package Patterns/microservices/helm/ros2-microservices -d dist/charts
          helm package Patterns/dynamic-loader/helm/dynamic-loader -d dist/charts
          helm package Patterns/overlay-workspaces/helm/ros2-overlay -d dist/charts

      - name: Checkout gh-pages (merge existing index)
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:charts/index.yaml > /tmp/old-index.yaml 2>/dev/null; then
            echo "Merging with existing index.yaml..."
            helm repo index dist/charts \
              --url https://cigip-upv.github.io/Kubernetes-deployment-patterns/charts \
              --merge /tmp/old-index.yaml
          else
            echo "No existing index.yaml, creating fresh..."
            helm repo index dist/charts \
              --url https://cigip-upv.github.io/Kubernetes-deployment-patterns/charts
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/charts
          destination_dir: charts
          keep_files: true
          enable_jekyll: false

      - name: Summary
        run: |
          echo "### Helm Charts Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          for tgz in dist/charts/*.tgz; do
            name=$(basename "$tgz" .tgz)
            echo "| ${name} | published |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Refresh Rancher repository to see new versions." >> $GITHUB_STEP_SUMMARY
